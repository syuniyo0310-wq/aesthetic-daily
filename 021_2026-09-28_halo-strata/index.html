<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Halo Strata</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const RULES = [
  { name: 'Conway B3/S23',        b: [3],          s: [2, 3] },
  { name: 'HighLife B36/S23',     b: [3, 6],       s: [2, 3] },
  { name: 'Move B368/S245',       b: [3, 6, 8],    s: [2, 4, 5] },
  { name: 'Coral B3/S45678',      b: [3],          s: [4, 5, 6, 7, 8] },
  { name: 'Anneal B4678/S35678',  b: [4, 6, 7, 8], s: [3, 5, 6, 7, 8] },
];
const PALETTES = [
  { name: '墨と金',   bg: '#07060a', c: ['#2a2530', '#c9a24a', '#f3e6c4', '#7a5a2a'] },
  { name: '浮世絵',   bg: '#0b1020', c: ['#1d3557', '#e63946', '#f1faee', '#e9c46a'] },
  { name: 'Coral',    bg: '#0a0608', c: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff'] },
  { name: '翡翠',     bg: '#040a09', c: ['#0f3d3a', '#3fbf9f', '#e8f5e0', '#d4a95a'] },
];
const pal = pick(PALETTES);
const stops = pal.c.map((h) => new THREE.Color(h));
const colorAt = (h, out) => {
  const f = (((h % 1) + 1) % 1) * stops.length, i = Math.floor(f);
  return out.lerpColors(stops[i], stops[(i + 1) % stops.length], f - i);
};

// --- 多種族 Life。長老（長生きしたセル）は周りの誕生を抑える → 塊のまわりに空洞の輪（ハロー）ができる ---
const N = 84, G = 150, H = 0.5, ELDER = 10, HALO = 2;
let alive = new Uint8Array(N * N), hue = new Float32Array(N * N), age = new Uint16Array(N * N);
const SLOW = [RULES[3], RULES[4]], FAST = [RULES[0], RULES[1], RULES[2]];
let rules = [];
const ruleFor = (h) => rules[Math.floor((((h % 1) + 1) % 1) * rules.length) % rules.length];
const TAU = Math.PI * 2;
const RIM = new Uint8Array(N * N).map((_, k) => +(Math.hypot(k % N - N / 2 + 0.5, Math.floor(k / N) - N / 2 + 0.5) > N * 0.47));

function blob(cx, cy, r, h, dens = 0.45) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (!RIM[y * N + x] && Math.hypot(x - cx, y - cy) < r && rand() < dens) { const k = y * N + x; alive[k] = 1; hue[k] = h + (rand() - 0.5) * 0.04; age[k] = 0; }
}
function seedWorld() {
  alive.fill(0); age.fill(0);
  rules = [pick(SLOW), pick(FAST), pick(FAST)];
  const n = 3 + Math.floor(rand() * 3);
  for (let i = 0; i < n; i++) blob(N * (0.22 + rand() * 0.56), N * (0.22 + rand() * 0.56), 7 + rand() * 11, i / n);
}
function step() {
  // 長老の影響圏（チェビシェフ距離 HALO 以内）
  const inh = new Uint8Array(N * N);
  for (let k = 0; k < N * N; k++) if (alive[k] && age[k] >= ELDER) {
    const x = k % N, y = Math.floor(k / N);
    for (let dy = -HALO; dy <= HALO; dy++) for (let dx = -HALO; dx <= HALO; dx++) inh[((y + dy + N) % N) * N + (x + dx + N) % N] = 1;
  }
  const na = new Uint8Array(N * N), nh = new Float32Array(N * N), ng = new Uint16Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = y * N + x;
    if (RIM[k]) continue;
    let n = 0, sx = 0, sy = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const j = ((y + dy + N) % N) * N + (x + dx + N) % N;
      if (alive[j]) { n++; sx += Math.cos(hue[j] * TAU); sy += Math.sin(hue[j] * TAU); }
    }
    if (alive[k]) { if (ruleFor(hue[k]).s.includes(n)) { na[k] = 1; nh[k] = hue[k]; ng[k] = Math.min(999, age[k] + 1); } }
    else if (n && !inh[k]) {
      const h = Math.atan2(sy, sx) / TAU;
      if (ruleFor(h).b.includes(n)) { na[k] = 1; nh[k] = h + (rand() < 0.03 ? (rand() - 0.5) * 0.3 : 0); }
    }
  }
  alive = na; hue = nh; age = ng;
}
// 事件は先に計算しておく（static）：変異・新種・浸食
const EVENTS = {
  mutate() { const i = Math.floor(rand() * rules.length); rules[i] = pick(RULES.filter((r) => r !== rules[i])); },
  bloom() { blob(N * (0.2 + rand() * 0.6), N * (0.2 + rand() * 0.6), 5 + rand() * 9, rand(), 0.5); },
  youth() { for (let k = 0; k < N * N; k++) if (age[k] > ELDER && rand() < 0.5) alive[k] = 0; },
};

// --- 年齢で3つの質感：若い＝艶の粒、壮年＝半艶の箱、長老＝太い金属の塊 ---
const CLASSES = [
  { mat: { roughness: 0.15, metalness: 0.0 }, bright: 1.1 },
  { mat: { roughness: 0.6, metalness: 0.1 }, bright: 0.9 },
  { mat: { roughness: 0.28, metalness: 0.85 }, bright: 1.25 },
];
const classOf = (a) => (a < 2 ? 0 : a < ELDER ? 1 : 2);
const sizeOf = (a) => (a < 2 ? 0.5 : a < ELDER ? 0.7 + a * 0.025 : Math.min(2.3, 1.05 + (a - ELDER) * 0.045));
const cells = [[], [], []];
seedWorld();
let lastEv = 0, nextEv = 30;
for (let g = 0; g < G; g++) {
  let pop = 0;
  for (let k = 0; k < N * N; k++) if (alive[k]) {
    pop++;
    const a = age[k];
    cells[classOf(a)].push(k % N - N / 2, g, Math.floor(k / N) - N / 2, sizeOf(a), hue[k]);
  }
  step();
  if (pop < N * N * 0.01) { seedWorld(); lastEv = g; }
  else if (pop > N * N * 0.3) { EVENTS[pick(['mutate', 'youth'])](); lastEv = g; }
  else if (g - lastEv > nextEv) { EVENTS[pick(Object.keys(EVENTS))](); lastEv = g; nextEv = 25 + Math.floor(rand() * 45); }
}

// --- three.js ---
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 110, 230);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const TOP = G * H;
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 600);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(38) / 2) / Math.pow(camera.aspect, 0.6))) : 38; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(102, TOP * 0.85, 102);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, TOP * 0.45, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(60, TOP + 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: TOP + 200 });
sun.target.position.set(0, TOP * 0.4, 0);
scene.add(sun, sun.target);

const geo = new THREE.BoxGeometry(1, H, 1);
const m4 = new THREE.Matrix4(), col = new THREE.Color();
const meshes = cells.map((arr, ci) => {
  const n = arr.length / 5;
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial(CLASSES[ci].mat), Math.max(1, n));
  const ys = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const [x, g, z, w, h] = arr.slice(i * 5, i * 5 + 5);
    m4.makeScale(w, 1, w).setPosition(x, g * H, z);
    mesh.setMatrixAt(i, m4);
    // 下の層ほど少し沈んだ色（時間の奥行き）
    colorAt(h, col).multiplyScalar(CLASSES[ci].bright * (0.45 + 0.55 * Math.pow(g / G, 0.7)));
    mesh.setColorAt(i, col);
    ys[i] = g;
  }
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.count = 0;
  scene.add(mesh);
  return { mesh, ys, n };
});

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.25, 0.35, 0.94));
composer.addPass(new OutputPass());

const info = document.getElementById('info');
info.textContent = `021 · HALO STRATA · ${rules.map((r) => r.name.split(' ')[0]).join(' / ')} · ${pal.name} · seed ${seed}`;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 's') {
    const a = document.createElement('a');
    a.download = `021_halo-strata_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click();
  }
});

// 下から積み上がって完成し、あとはカメラだけが回る
const t0 = performance.now(), BUILD = 6000;
renderer.setAnimationLoop((now) => {
  const g = Math.min(G, ((now - t0) / BUILD) * G);
  for (const { mesh, ys, n } of meshes) {
    let lo = 0, hi = n;
    while (lo < hi) { const m = (lo + hi) >> 1; if (ys[m] < g) lo = m + 1; else hi = m; }
    mesh.count = lo;
  }
  controls.update();
  composer.render();
});
</script>
</body>
</html>
