<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Strata Bore</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#hud{position:fixed;left:10px;bottom:8px;font:10px monospace;color:#666;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head><body><div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const Q = new URLSearchParams(location.search);
const seed = Q.has('seed') ? +Q.get('seed') : Math.floor(Math.random() * 1e6);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(seed * 9301 + 49297);
const pick = a => a[Math.floor(rnd() * a.length)];

const RULES = [
  { n: 'Conway', b: [3], s: [2, 3] }, { n: 'HighLife', b: [3, 6], s: [2, 3] },
  { n: 'Coral', b: [3], s: [4, 5, 6, 7, 8] }, { n: 'Day&Night', b: [3, 6, 7, 8], s: [3, 4, 6, 7, 8] },
  { n: 'Move', b: [3, 6, 8], s: [2, 4, 5] }, { n: 'Amoeba', b: [3, 5, 7], s: [1, 3, 5, 8] },
];
const mask = a => a.reduce((m, v) => m | 1 << v, 0);
const PALS = {
  NEON: null,
  'SUMI-GOLD': ['#1d1a17', '#6b5a3a', '#d8b25a', '#f3e2b0'],
  UKIYO: ['#1f3a5f', '#c8463a', '#efe1c0', '#3f8f86', '#e2a03f'],
  CORAL: ['#ff6f61', '#ffb38a', '#5b2a86', '#2ec4b6'],
  GLACIER: ['#0b2545', '#5fa8d3', '#cae9ff', '#8d6cab'],
};
const palName = pick(Object.keys(PALS));
const pal = PALS[palName] && PALS[palName].map(c => new THREE.Color(c));
function hueColor(h, out) {
  h = ((h % 1) + 1) % 1;
  if (!pal) return out.setHSL(h, 0.85, 0.55);
  const f = h * pal.length, i = Math.floor(f);
  return out.copy(pal[i]).lerp(pal[(i + 1) % pal.length], f - i);
}

const W = pick([72, 96, 120]), H = pick([16, 20, 26]);
const SEC = pick([{ n: 'CIRCLE', k: 0 }, { n: 'TRI', k: 3 }, { n: 'PETAL', k: 5 }, { n: 'HEX', k: 6 }]);
let rule = rnd() < 0.5 ? RULES[0] : pick(RULES), bm = mask(rule.b), sm = mask(rule.s);
let twist = (rnd() < 0.5 ? -1 : 1) * pick([0.01, 0.025, 0.05]), phase = 0;
let secK = SEC.k, amp = SEC.k ? 0.22 : 0, ampT = amp, r0 = 5, r0T = 5;
const CR = 0.3, DZ = 0.3, NS = 190;

let A = new Uint8Array(W * H), B = new Uint8Array(W * H);
let HU = new Float32Array(W * H), HU2 = new Float32Array(W * H);
const idx = (x, y) => ((x % W) + W) % W + y * W;
function blob(cx, cy, rad, hue, dens) {
  for (let y = 0; y < H; y++) for (let dx = -rad; dx <= rad; dx++) {
    const dy = y - cy; if (dx * dx + dy * dy > rad * rad || rnd() > dens) continue;
    const i = idx(cx + dx, y); A[i] = 1; HU[i] = hue + (rnd() - 0.5) * 0.04;
  }
}
function seedWorld() { const n = 3 + Math.floor(rnd() * 4); for (let s = 0; s < n; s++) blob(Math.floor(rnd() * W), Math.floor(rnd() * H), 3 + Math.floor(rnd() * H * 0.5), rnd(), 0.45); }
seedWorld();

function step() {
  let alive = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let n = 0, cx = 0, sx = 0;
    for (let dy = -1; dy <= 1; dy++) {
      const yy = y + dy; if (yy < 0 || yy >= H) continue;
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue; const j = idx(x + dx, yy);
        if (A[j]) { n++; cx += Math.cos(HU[j] * 6.2832); sx += Math.sin(HU[j] * 6.2832); }
      }
    }
    const i = x + y * W, on = A[i] ? (sm >> n) & 1 : (bm >> n) & 1;
    B[i] = on; HU2[i] = A[i] ? HU[i] : (on ? Math.atan2(sx, cx) / 6.2832 : 0);
    alive += on;
  }
  [A, B] = [B, A]; [HU, HU2] = [HU2, HU];
  return alive / (W * H);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0); scene.fog = new THREE.Fog(0, 13, 13 + NS * DZ * 0.85);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 200);
camera.position.set(6.5, 3.8, 15);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0, -16); controls.enableDamping = true;
function fitFov() { const a = innerWidth / innerHeight; camera.aspect = a; camera.fov = a < 1 ? Math.min(100, 2 * Math.atan(Math.tan(31 * Math.PI / 180) / a) * 180 / Math.PI) : 62; camera.updateProjectionMatrix(); }
fitFov();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); fitFov(); });
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const lamp = new THREE.PointLight(0xfff2dd, 2.2, 0, 0); scene.add(lamp);
const key = new THREE.DirectionalLight(0xffffff, 0.8); key.position.set(3, 5, 4); scene.add(key);

const geo = new THREE.BoxGeometry(1, 1, 1), mat = new THREE.MeshLambertMaterial();
const world = new THREE.Group(); scene.add(world);
const slices = [];
for (let s = 0; s < NS; s++) {
  const m = new THREE.InstancedMesh(geo, mat, W * H); m.count = 0; m.frustumCulled = false;
  m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(W * H * 3), 3);
  m.userData.gen = -1; world.add(m); slices.push(m);
}
let gen = 0; const col = new THREE.Color();
function writeSlice() {
  const m = slices[gen % NS], e = m.instanceMatrix.array, c = m.instanceColor.array; let k = 0;
  const dA = 6.2832 / W;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = x + y * W; if (!A[i]) continue;
    const a = x * dA + phase, base = r0 * (1 + amp * Math.cos(secK * a)), r = base + y * CR;
    const ca = Math.cos(a), sa = Math.sin(a), born = !B[i];
    const sx = CR * 0.88, sy = r * dA * 0.86, sz = DZ * (born ? 0.55 : 0.9), o = k * 16;
    e[o] = ca * sx; e[o + 1] = sa * sx; e[o + 2] = 0; e[o + 3] = 0;
    e[o + 4] = -sa * sy; e[o + 5] = ca * sy; e[o + 6] = 0; e[o + 7] = 0;
    e[o + 8] = 0; e[o + 9] = 0; e[o + 10] = sz; e[o + 11] = 0;
    e[o + 12] = ca * r; e[o + 13] = sa * r; e[o + 14] = 0; e[o + 15] = 1;
    hueColor(HU[i], col).multiplyScalar((born ? 1.25 : 1) * (1 - 0.55 * y / H));
    c[k * 3] = col.r; c[k * 3 + 1] = col.g; c[k * 3 + 2] = col.b; k++;
  }
  m.count = k; m.userData.gen = gen; m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true;
}

let nextEvent = 95, lastEv = '—', prevD = 0, still = 0;
function event(kind) {
  kind = kind || pick(['mutate', 'invade', 'kaleido', 'twist', 'pinch', 'invade']);
  if (kind === 'mutate') { rule = pick(RULES.filter(r => r !== rule)); bm = mask(rule.b); sm = mask(rule.s); }
  if (kind === 'invade') blob(Math.floor(rnd() * W), Math.floor(rnd() * H), 2 + Math.floor(rnd() * H * 0.6), rnd(), 0.5);
  if (kind === 'kaleido') {
    const f = pick([2, 3, 4, 6].filter(v => W % v === 0)), w = W / f;
    for (let y = 0; y < H; y++) for (let x = w; x < W; x++) { const i = x + y * W, j = (x % w) + y * W; A[i] = A[j]; HU[i] = HU[j] + Math.floor(x / w) * 0.07; }
  }
  if (kind === 'twist') twist = -Math.sign(twist) * pick([0.006, 0.02, 0.045]);
  if (kind === 'pinch') { secK = pick([0, 2, 3, 4, 5, 6, 8]); ampT = secK ? 0.12 + rnd() * 0.25 : 0; r0T = 3.6 + rnd() * 2.6; }
  lastEv = kind; nextEvent = gen + 110 + Math.floor(rnd() * 140);
}
function advance() {
  const d = step();
  if (d < 0.04) { seedWorld(); lastEv = 'rebirth'; }
  else if (d > 0.5) { rule = RULES[0]; bm = mask(rule.b); sm = mask(rule.s); for (let i = 0; i < W * H; i++) if (rnd() < 0.5) A[i] = 0; lastEv = 'overflow'; }
  still = Math.abs(d - prevD) < 0.002 ? still + 1 : 0; prevD = d;
  if (still > 30) { event('invade'); still = 0; }
  if (gen >= nextEvent) event();
  amp += (ampT - amp) * 0.03; r0 += (r0T - r0) * 0.03; phase += twist;
  gen++; writeSlice();
}
for (let i = 0; i < NS; i++) advance();

const hud = document.getElementById('hud');
let frame = 0, paused = false;
addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (k === 'e') event();
  if (k === ' ') paused = !paused;
  if (k === 'r') { Q.set('seed', Math.floor(Math.random() * 1e6)); location.search = Q.toString(); }
  if (k === 's') { const a = document.createElement('a'); a.download = `strata-bore-${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
function loop() {
  requestAnimationFrame(loop);
  if (!paused) { frame++; if (frame % 3 === 0) advance(); }
  const fr = paused ? 0 : (frame % 3) / 3;
  for (const m of slices) m.position.z = -(gen - 1 - m.userData.gen + fr) * DZ;
  world.rotation.z = -phase * 0.5;
  lamp.position.copy(camera.position);
  controls.update(); renderer.render(scene, camera);
  if (frame % 15 === 0) hud.textContent = `043 · STRATA BORE · ${rule.n} · ${palName} · ${SEC.n} · seed ${seed} · gen ${gen} · ${lastEv}`;
}
loop();
</script></body></html>
