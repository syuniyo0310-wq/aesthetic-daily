<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Geode Strata</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#040406;overflow:hidden}
#hud{position:fixed;left:10px;bottom:8px;font:10px monospace;color:#8a8a9a99;letter-spacing:.08em;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head><body><div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const qs = new URLSearchParams(location.search);
const seed = parseInt(qs.get('seed')) || (1 + Math.floor(Math.random() * 9999));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(seed * 7919 + 13);
const pick = (arr, w) => { if (!w) return arr[Math.floor(rnd() * arr.length)]; let s = w.reduce((a, b) => a + b), r = rnd() * s; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; } return arr[arr.length - 1]; };

const PALETTES = {
  'SUMI-GOLD': ['#d9a441', '#8c5a2b', '#efe2c0', '#5b6b7a'],
  'NEON': ['#ff3d8b', '#22e3ff', '#b6ff3a', '#ffb000'],
  'UKIYO': ['#d8463a', '#2c5d8f', '#e9c46a', '#3f8f7a'],
  'CORAL': ['#ff7a5c', '#ffd1a1', '#c2306b', '#4fb3a9'],
  'GLACIER': ['#9fd8ff', '#3e6fd8', '#e8f4ff', '#7a54c9'],
};
const GRIDS = { COARSE: 1700, MID: 3000, FINE: 5200 };
const gridName = pick(['COARSE', 'MID', 'FINE'], [3, 4, 3]);
const cut = pick(['WEDGE', 'HALF', 'BANDS', 'SLIT'], [4, 2, 2, 2]);
const palName = pick(Object.keys(PALETTES));
const speciesN = pick([2, 3, 4], [2, 3, 3]);
const pal = PALETTES[palName].slice(0, speciesN).map(c => new THREE.Color(c));
const RULES = [
  { n: 'B2/S34', b: [2], s: [3, 4] }, { n: 'B2/S23', b: [2], s: [2, 3] },
  { n: 'B2/S345', b: [2], s: [3, 4, 5] }, { n: 'B24/S35', b: [2, 4], s: [3, 5] },
  { n: 'B25/S34', b: [2, 5], s: [3, 4] }];
const mask = a => a.reduce((m, v) => m | (1 << v), 0);
let rule = pick(RULES);

const N = GRIDS[gridName], L = 52, K = 6, SHRINK = 0.983, R = 10;
const dir = new Float32Array(N * 3), basis = new Float32Array(N * 6);
const ga = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i + 0.5) / N * 2, r = Math.sqrt(1 - y * y), th = ga * i;
  const x = Math.cos(th) * r, z = Math.sin(th) * r;
  dir.set([x, y, z], i * 3);
  const n = new THREE.Vector3(x, y, z), t1 = new THREE.Vector3(0, 1, 0).cross(n);
  if (t1.lengthSq() < 1e-6) t1.set(1, 0, 0); t1.normalize();
  const t2 = n.clone().cross(t1);
  basis.set([t1.x, t1.y, t1.z, t2.x, t2.y, t2.z], i * 6);
}
const nb = new Int32Array(N * K), anti = new Int32Array(N);
{
  const bd = new Float32Array(K), bi = new Int32Array(K);
  for (let i = 0; i < N; i++) {
    bd.fill(9); let ad = 9;
    const xi = dir[i * 3], yi = dir[i * 3 + 1], zi = dir[i * 3 + 2];
    for (let j = 0; j < N; j++) {
      if (j === i) continue;
      const dx = dir[j * 3] - xi, dy = dir[j * 3 + 1] - yi, dz = dir[j * 3 + 2] - zi, d = dx * dx + dy * dy + dz * dz;
      const ax = dir[j * 3] + xi, ay = dir[j * 3 + 1] + yi, az = dir[j * 3 + 2] + zi, e = ax * ax + ay * ay + az * az;
      if (e < ad) { ad = e; anti[i] = j; }
      if (d < bd[K - 1]) { let k = K - 1; while (k > 0 && bd[k - 1] > d) { bd[k] = bd[k - 1]; bi[k] = bi[k - 1]; k--; } bd[k] = d; bi[k] = j; }
    }
    nb.set(bi, i * K);
  }
}
const visible = new Uint8Array(N);
for (let i = 0; i < N; i++) {
  const x = dir[i * 3], y = dir[i * 3 + 1], z = dir[i * 3 + 2], az = Math.atan2(z, x);
  let v = true;
  if (cut === 'WEDGE') v = !(az > -0.2 && az < 1.45 && y < 0.75);
  else if (cut === 'HALF') v = z < 0.05;
  else if (cut === 'BANDS') v = Math.floor((Math.asin(y) + 2) / 0.32) % 2 === 0 || y < -0.55;
  else if (cut === 'SLIT') v = !(Math.abs(az - 0.6) < 0.36);
  visible[i] = v ? 1 : 0;
}

const hist = []; for (let l = 0; l < L; l++) hist.push(new Uint8Array(N));
let head = 0, gen = 0;
const cur = () => hist[head];
function seedCap(d, ang, sp, dens) {
  const c = Math.cos(ang), g = cur();
  for (let i = 0; i < N; i++) if (dir[i * 3] * d[0] + dir[i * 3 + 1] * d[1] + dir[i * 3 + 2] * d[2] > c && rnd() < dens) g[i] = sp + 1;
}
const randDir = () => { const u = rnd() * 2 - 1, t = rnd() * 6.283, r = Math.sqrt(1 - u * u); return [Math.cos(t) * r, u, Math.sin(t) * r]; };
const tally = new Int32Array(5);
function step() {
  const g = cur(), nx = hist[(head + L - 1) % L], bm = mask(rule.b), sm = mask(rule.s);
  let pop = 0;
  for (let i = 0; i < N; i++) {
    let c = 0; tally.fill(0);
    for (let k = 0; k < K; k++) { const s = g[nb[i * K + k]]; if (s) { c++; tally[s]++; } }
    if (g[i]) nx[i] = (sm >> c) & 1 ? g[i] : 0;
    else if ((bm >> c) & 1) { let best = 1; for (let s = 2; s <= speciesN; s++) if (tally[s] > tally[best] || (tally[s] === tally[best] && rnd() < 0.5)) best = s; nx[i] = best; }
    else nx[i] = 0;
    if (nx[i]) pop++;
  }
  head = (head + L - 1) % L; gen++;
  const f = pop / N;
  if (f < 0.03) { seedCap(randDir(), 0.5, Math.floor(rnd() * speciesN), 0.45); event('REBIRTH'); }
  else if (f > 0.55) { rule = RULES[0]; event('THIN'); }
}
let lastEvent = '';
function event(kind) {
  const g = cur();
  if (!kind) kind = pick(['MUTATE', 'INVADE', 'MIRROR', 'BELT'], [3, 3, 2, 2]);
  if (kind === 'MUTATE') { let r; do r = pick(RULES); while (r === rule); rule = r; }
  if (kind === 'INVADE') { const sp = Math.floor(rnd() * speciesN); for (let k = 0; k < 2; k++) seedCap(randDir(), 0.32 + rnd() * 0.3, sp, 0.5); }
  if (kind === 'MIRROR') for (let i = 0; i < N; i++) if (dir[i * 3 + 1] > 0) g[anti[i]] = g[i];
  if (kind === 'BELT') { const d = randDir(); for (let i = 0; i < N; i++) { const p = dir[i * 3] * d[0] + dir[i * 3 + 1] * d[1] + dir[i * 3 + 2] * d[2]; if (Math.abs(p) < 0.07 && rnd() < 0.6) g[i] = 1 + (i % speciesN); } }
  lastEvent = kind;
}
for (let s = 0; s < speciesN; s++) seedCap(randDir(), 0.55 + rnd() * 0.35, s, 0.42);
for (let i = 0; i < L + 10; i++) step();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#040406');
scene.fog = new THREE.FogExp2('#040406', 0.022);
const BASE_FOV = 38;
const camera = new THREE.PerspectiveCamera(BASE_FOV, 1, 0.1, 200);
camera.position.set(23, 13, 32);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0, 0);
scene.add(new THREE.HemisphereLight('#c8d0ff', '#1a1008', 0.55));
const key = new THREE.DirectionalLight('#fff3e0', 2.2); key.position.set(12, 18, 10); scene.add(key);
const rim = new THREE.DirectionalLight('#7aa8ff', 0.9); rim.position.set(-14, -4, -12); scene.add(rim);
const core = new THREE.PointLight(pal[0], 30, 14, 1.6); scene.add(core);

const MAXI = N * L;
const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.15 }), MAXI);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAXI * 3), 3);
mesh.frustumCulled = false;
const group = new THREE.Group(); group.add(mesh); scene.add(group);
group.rotation.set(0.35, 0, 0.12);
const M = mesh.instanceMatrix.array, C = mesh.instanceColor.array;
const spacing = Math.sqrt(4 * Math.PI / N);
const tmp = new THREE.Color();
function build(frac) {
  let n = 0;
  for (let a = 0; a < L; a++) {
    const g = hist[(head + a) % L], older = hist[(head + a + 1) % L], newer = a > 0 ? hist[(head + a - 1) % L] : null;
    const age = a + frac, r = R * Math.pow(SHRINK, age), th = r * (1 - SHRINK) * 1.02, s = spacing * r * 0.64;
    const fade = Math.pow(1 - a / L, 1.4);
    for (let i = 0; i < N; i++) {
      const sp = g[i]; if (!sp || !visible[i]) continue;
      const run = (newer && newer[i] === sp ? 1 : 0) + (older[i] === sp ? 1 : 0);
      const tw = s * (run === 2 ? 0.55 : run === 1 ? 0.8 : 1.15), o = n * 16, b = i * 6, d = i * 3;
      M[o] = basis[b] * tw; M[o + 1] = basis[b + 1] * tw; M[o + 2] = basis[b + 2] * tw; M[o + 3] = 0;
      M[o + 4] = basis[b + 3] * tw; M[o + 5] = basis[b + 4] * tw; M[o + 6] = basis[b + 5] * tw; M[o + 7] = 0;
      M[o + 8] = dir[d] * th; M[o + 9] = dir[d + 1] * th; M[o + 10] = dir[d + 2] * th; M[o + 11] = 0;
      M[o + 12] = dir[d] * r; M[o + 13] = dir[d + 1] * r; M[o + 14] = dir[d + 2] * r; M[o + 15] = 1;
      tmp.copy(pal[sp - 1]);
      const born = older[i] === 0 ? 1.45 : 1;
      tmp.multiplyScalar(fade * born * (a === 0 ? 1.25 : 1));
      C[n * 3] = tmp.r; C[n * 3 + 1] = tmp.g; C[n * 3 + 2] = tmp.b;
      n++;
    }
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
}

function resize() {
  const w = innerWidth, h = innerHeight, asp = w / h;
  camera.aspect = asp;
  camera.fov = asp < 1 ? 2 * Math.atan(Math.tan(BASE_FOV * Math.PI / 360) / asp) * 180 / Math.PI : BASE_FOV;
  camera.updateProjectionMatrix(); renderer.setSize(w, h);
}
addEventListener('resize', resize); resize();

let paused = false, acc = 0, nextEvent = 3.2, t = 0, last = performance.now();
const GEN_DT = 1 / 7;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { location.search = '?seed=' + (1 + Math.floor(Math.random() * 99999)); }
  if (k === 's') { const a = document.createElement('a'); a.download = `geode-strata_${seed}.png`; a.href = renderer.domElement.toDataURL('image/png'); a.click(); }
  if (k === 'e') { event(); nextEvent = t + 6 + rnd() * 3; }
  if (k === ' ') { paused = !paused; e.preventDefault(); }
});
const hud = document.getElementById('hud');
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    t += dt; acc += dt;
    while (acc > GEN_DT) { acc -= GEN_DT; step(); }
    if (t > nextEvent) { event(); nextEvent = t + 5.5 + rnd() * 3.5; }
    group.rotation.y += dt * 0.07;
  }
  build(paused ? 0 : acc / GEN_DT);
  core.intensity = 22 + 10 * Math.sin(t * 0.7);
  controls.update();
  hud.textContent = `039 · GEODE STRATA · ${rule.n} · ${gridName} · ${cut} · ${palName} · seed ${seed} · gen ${gen}${lastEvent ? ' · ' + lastEvent : ''}`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
