<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Oxbow Fall</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALS = [
  { name: 'Silt', bg: '#07080a', river: '#e9e4d8', c: ['#d8a35a', '#7fb3c8', '#c4675a', '#e9d9b0'] },
  { name: 'Delta', bg: '#04070a', river: '#dff6ff', c: ['#4fd1c5', '#7aa2ff', '#f6c56f', '#ff7aa8'] },
  { name: 'Ash', bg: '#0a0908', river: '#fff3e0', c: ['#b9b2a6', '#e07a3f', '#8c8577', '#f1d7a8'] },
];
const pal = pick(PALS);
const LAG = pick([3, 6, 11]), BELT = pick([12, 17, 22]), SINK = pick([0.04, 0.06, 0.09]);
const DS = 0.55, HALF = 28;

let pts = [];
for (let x = -HALF; x <= HALF; x += DS) pts.push({ x, z: Math.sin(x * 0.21 + rand() * 6) * 0.8 + (rand() - 0.5) * 0.3 });
const oxbows = [];
let simT = 0, cutoffs = 0, flood = 0, lastCut = '';

function curvatures() {
  const n = pts.length, c = new Float32Array(n);
  for (let i = 1; i < n - 1; i++) {
    const ax = pts[i].x - pts[i - 1].x, az = pts[i].z - pts[i - 1].z;
    const bx = pts[i + 1].x - pts[i].x, bz = pts[i + 1].z - pts[i].z;
    c[i] = Math.atan2(ax * bz - az * bx, ax * bx + az * bz) / DS;
  }
  const sm = new Float32Array(n);
  for (let i = 1; i < n - 1; i++) sm[i] = (c[i - 1] + 2 * c[i] + c[i + 1]) / 4;
  return sm;
}
function resample() {
  const out = [pts[0]];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    let L = Math.hypot(b.x - a.x, b.z - a.z), t = DS - carry;
    while (t <= L) { out.push({ x: a.x + (b.x - a.x) * t / L, z: a.z + (b.z - a.z) * t / L }); t += DS; }
    carry = L - (t - DS);
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(out.at(-1).x - last.x, out.at(-1).z - last.z) > DS * 0.3) out.push({ ...last });
  pts = out;
}
function cutoff() {
  const n = pts.length, R = DS * 1.25;
  for (let i = 8; i < n - 8; i++) for (let j = i + 22; j < Math.min(n - 8, i + n * 0.45); j++) {
    if (Math.abs(pts[i].x - pts[j].x) > R) continue;
    if (Math.hypot(pts[i].x - pts[j].x, pts[i].z - pts[j].z) < R) {
      const loop = pts.slice(i, j + 1);
      oxbows.push({ pts: loop, born: simT, hue: cutoffs % 4, depth: 0 });
      if (oxbows.length > 90) oxbows.shift();
      pts = pts.slice(0, i + 1).concat(pts.slice(j));
      cutoffs++; lastCut = `CUTOFF ${cutoffs}`;
      return true;
    }
  }
  return false;
}
function step(dt) {
  const c = curvatures(), n = pts.length, E = 0.75 * (1 + flood * 2.2);
  const move = new Float32Array(n * 2), wsum = (1 - Math.exp(-12 / LAG)) / (1 - Math.exp(-1 / LAG));
  for (let i = 2; i < n - 2; i++) {
    let up = 0;
    for (let k = 1; k <= 12 && i - k > 0; k++) up += c[i - k] * Math.exp(-(k - 1) / LAG);
    const R = 0.55 * c[i] + 1.55 * up / wsum;
    const tx = pts[i + 1].x - pts[i - 1].x, tz = pts[i + 1].z - pts[i - 1].z, tl = Math.hypot(tx, tz) || 1;
    const nx = -tz / tl, nz = tx / tl;
    move[i * 2] = -R * nx * E * dt;
    move[i * 2 + 1] = -R * nz * E * dt + (rand() - 0.5) * 0.004;
  }
  for (let i = 2; i < n - 2; i++) {
    pts[i].x += move[i * 2]; pts[i].z += move[i * 2 + 1];
    if (Math.abs(pts[i].z) > BELT) pts[i].z *= 0.985;
    const edge = Math.min(i, n - 1 - i);
    if (edge < 14) { pts[i].z *= 0.9; pts[i].x += ((i < n / 2 ? -HALF + edge * DS : HALF - edge * DS) - pts[i].x) * 0.1; }
    pts[i].x = Math.max(-HALF + 2, Math.min(HALF - 2, pts[i].x));
  }
  resample();
  cutoff();
  if (pts.length > 900) { pts = pts.filter((_, k) => k % 2 === 0 || k === pts.length - 1); }
  for (const o of oxbows) o.depth += SINK * dt * 60 * (1 + flood);
  flood = Math.max(0, flood - dt * 0.25);
  simT += dt;
}
for (let k = 0; k < 1400; k++) step(0.05);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.FogExp2(pal.bg, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov(); camera.position.set(36, 4, 40);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, -11, 0); controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [a, b, d, tx, ty, tz] = c.split(',').map(Number); if ([a, b, d].every(Number.isFinite)) window.__view.set({ x: a, y: b, z: d, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(10, 30, 14); scene.add(dir);

const MAX = 16000;
const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.2 }), MAX);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX * 3), 3);
mesh.frustumCulled = false; scene.add(mesh);
const dummy = new THREE.Object3D(), river = new THREE.Color(pal.river), cols = pal.c.map((h) => new THREE.Color(h)), tmp = new THREE.Color();
let n = 0;
function put(a, b, y, w, h, color) {
  if (n >= MAX) return;
  const mx = (a.x + b.x) / 2, mz = (a.z + b.z) / 2, L = Math.hypot(b.x - a.x, b.z - a.z) || DS;
  dummy.position.set(mx, y, mz);
  dummy.rotation.set(0, Math.atan2(b.x - a.x, b.z - a.z), 0);
  dummy.scale.set(w, h, L * 1.05);
  dummy.updateMatrix(); mesh.setMatrixAt(n, dummy.matrix); mesh.setColorAt(n, color); n++;
}
function draw() {
  n = 0;
  const c = curvatures();
  for (let i = 1; i < pts.length; i++) put(pts[i - 1], pts[i], 0, 0.35 + Math.min(1.1, Math.abs(c[i]) * 1.8), 0.35, river);
  for (const o of oxbows) {
    const age = simT - o.born, wall = Math.max(0.25, 1.6 - age * 0.01);
    tmp.copy(cols[o.hue]).multiplyScalar(Math.max(0.35, 1 - age * 0.005));
    const P = o.pts;
    for (let i = 1; i < P.length; i++) put(P[i - 1], P[i], -2 - o.depth, 0.2, wall, tmp);
    put(P[P.length - 1], P[0], -2 - o.depth, 0.2, wall, tmp);
  }
  mesh.count = Math.max(1, n);
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
  while (oxbows.length && oxbows[0].depth > 36) oxbows.shift();
}
draw();
window.__dbg = () => ({ pts: pts.length, oxbows: oxbows.length, cutoffs, simT: +simT.toFixed(1) });

let paused = false, evAt = -1e9, ev = '', when = performance.now() + 8000, seenCut = cutoffs;
function fire() { flood = 1.6; ev = 'FLOOD'; evAt = performance.now(); when = evAt + 8000 + rand() * 4000; }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') fire();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `032_oxbow-fall_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
const hud = document.getElementById('info');
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (now > when) fire();
    step(0.05); step(0.05);
    if (cutoffs !== seenCut) { seenCut = cutoffs; ev = lastCut; evAt = now; }
    draw();
  }
  controls.update(); renderer.render(scene, camera);
  hud.textContent = `032 · OXBOW FALL · lag ${LAG} · belt ${BELT} · ${pal.name} · seed ${seed}${now - evAt < 1400 ? '\n' + ev : ''}`;
});
</script></body></html>
