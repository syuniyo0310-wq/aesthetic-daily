<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Braid Shear</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALETTES = [
  { name: 'Ember', bg: '#070301', c: ['#ff5a1f', '#ffb347', '#ffe8c2', '#7a1c0c'] },
  { name: 'Ink',   bg: '#04060a', c: ['#f4efe4', '#d7b15a', '#8ec8c8', '#c45a4a'] },
  { name: 'Neon',  bg: '#030208', c: ['#ff2fb3', '#00e5ff', '#7dff3a', '#ffe14d'] },
  { name: 'Ice',   bg: '#010307', c: ['#dfe9ff', '#6ff7d2', '#4d96ff', '#b388ff'] },
];
const pal = pick(PALETTES);
const stops = pal.c.map((h) => new THREE.Color(h));
const LAYOUTS = ['TOWER', 'ARCH', 'FORK', 'RING'];
const layout = pick(LAYOUTS);
const CORDS = layout === 'FORK' ? 3 : 1;
const STRANDS = pick([5, 7, 9]);
const TURNS = pick([1.6, 2.6, 4.2]);
const pitchName = TURNS < 2 ? '開' : TURNS < 3 ? '中' : '密';
const twistAt = (j, sIdx) => (j / (L - 1)) * TURNS * Math.PI * 2 + sIdx * (Math.PI * 2 / STRANDS);
const fine = rand() < 0.5;
let scale = fine ? 0.05 : 0.028;
let flow = 0.85 + rand() * 0.5;
const noise = new SimplexNoise({ random: rand });

const L = 72, SEG = L - 1, N = CORDS * STRANDS;
const hist = new Float32Array(CORDS * L * 3);
const uHead = new Float32Array(CORDS);
const peel = new Uint8Array(N);
const page = new Float32Array(N);
const phist = new Float32Array(N * L * 3);
const raw = new Float32Array(L * 3);
const pos = new Float32Array(N * SEG * 18);
const colA = new Float32Array(N * SEG * 18);
const tmp = new THREE.Vector3(), att = new THREE.Vector3(), oct = new THREE.Vector3(), nrm = new THREE.Vector3(), bin = new THREE.Vector3();
const a1 = new THREE.Vector3(), a2 = new THREE.Vector3(), b1 = new THREE.Vector3(), b2 = new THREE.Vector3();
const c1 = new THREE.Vector3(), c2 = new THREE.Vector3();
const col = new THREE.Color();

function anchor(c, u) {
  if (layout === 'TOWER') return [0, (u * 2 - 1) * 13, 0];
  if (layout === 'ARCH') {
    const a = Math.PI * (0.12 + 0.76 * u);
    return [Math.cos(a) * 15, Math.sin(a) * 13 - 1, 0];
  }
  if (layout === 'FORK') {
    const a = c * 2.15 + 0.5;
    return [Math.cos(a) * (4 + u * 13), (u - 0.35) * 10, Math.sin(a) * (4 + u * 13)];
  }
  const a = u * Math.PI * 2 + c;
  return [Math.cos(a) * 13, Math.sin(a * 2) * 3.2, Math.sin(a) * 13];
}
for (let c = 0; c < CORDS; c++) uHead[c] = rand();

function potential(x, y, z, out) {
  return out.set(noise.noise3d(x, y + simT, z), noise.noise3d(x + 31.4, y, z - simT), noise.noise3d(x - 17.2, y + 9.1 - simT, z));
}
function curl(p, sc, out) {
  const x = p.x * sc, y = p.y * sc, z = p.z * sc, e = 0.5 * sc;
  potential(x + e, y, z, a1); potential(x - e, y, z, a2);
  potential(x, y + e, z, b1); potential(x, y - e, z, b2);
  potential(x, y, z + e, c1); potential(x, y, z - e, c2);
  return out.set((b1.z - b2.z) - (c1.y - c2.y), (c1.x - c2.x) - (a1.z - a2.z), (a1.y - a2.y) - (b1.x - b2.x)).multiplyScalar(1 / (2 * e));
}

let simT = 0, whip = 0;
function layCord(c) {
  const base = c * L * 3;
  const amp = (whip > 0 ? 1.45 : 0.28) * flow;
  for (let j = 0; j < L; j++) {
    let u = layout === 'RING' ? (j / L + uHead[c]) % 1 : 0.02 + (j / (L - 1)) * 0.96;
    if (layout !== 'RING') u += Math.sin(simT * 0.35 + c) * 0.025;
    const p = anchor(c, u);
    tmp.set(p[0], p[1], p[2]);
    curl(tmp, scale, att); curl(tmp, scale * 2.6, oct);
    att.multiplyScalar(amp).addScaledVector(oct, amp * 0.35);
    hist[base + j * 3] = p[0] + att.x;
    hist[base + j * 3 + 1] = p[1] + att.y;
    hist[base + j * 3 + 2] = p[2] + att.z;
  }
  for (let pass = 0; pass < 2; pass++) {
    for (let j = 0; j < L * 3; j++) raw[j] = hist[base + j];
    for (let j = 0; j < L; j++) {
      const a = layout === 'RING' ? (j + L - 1) % L : Math.max(0, j - 1);
      const b = layout === 'RING' ? (j + 1) % L : Math.min(L - 1, j + 1);
      for (let k = 0; k < 3; k++) hist[base + j * 3 + k] = (raw[a * 3 + k] + raw[j * 3 + k] * 2 + raw[b * 3 + k]) * 0.25;
    }
  }
}
function step(dt) {
  simT += dt;
  if (whip > 0) whip -= dt;
  const spd = whip > 0 ? 1.6 : 1;
  for (let c = 0; c < CORDS; c++) {
    uHead[c] = (uHead[c] + dt * 0.05 * spd) % 1;
    layCord(c);
  }
  for (let i = 0; i < N; i++) {
    if (!peel[i]) continue;
    const base = i * L * 3;
    phist.copyWithin(base + 3, base, base + (L - 1) * 3);
    tmp.set(phist[base + 3], phist[base + 4], phist[base + 5]);
    curl(tmp, scale * 1.4, att);
    tmp.addScaledVector(att, dt * 7);
    tmp.y -= dt * 7.5;
    tmp.x *= 0.992; tmp.z *= 0.992;
    if (tmp.y < -15) tmp.y = -15;
    phist[base] = tmp.x; phist[base + 1] = tmp.y; phist[base + 2] = tmp.z;
    page[i] -= dt;
    if (page[i] <= 0) peel[i] = 0;
  }
}
function shear() {
  whip = 1.35;
  flow = 0.75 + rand() * 0.7;
  scale = (fine ? 0.045 : 0.026) * (0.8 + rand() * 0.5);
  for (let c = 0; c < CORDS; c++) {
    let pickI = -1;
    for (let s = STRANDS - 1; s >= 1; s--) {
      const i = c * STRANDS + s;
      if (!peel[i]) { pickI = i; break; }
    }
    if (pickI < 0) continue;
    const pb = pickI * L * 3, sIdx = pickI % STRANDS, rad = 0.55 + sIdx * 0.16;
    const base = c * L * 3;
    for (let j = 0; j < L; j++) {
      const h = base + j * 3;
      const x0 = hist[h], y0 = hist[h + 1], z0 = hist[h + 2];
      const nJ = Math.min(j + 1, L - 1);
      let dx = x0 - hist[base + nJ * 3], dy = y0 - hist[base + nJ * 3 + 1], dz = z0 - hist[base + nJ * 3 + 2];
      const dl = Math.hypot(dx, dy, dz) || 1;
      basis(dx / dl, dy / dl, dz / dl, twistAt(j, sIdx));
      phist[pb + j * 3] = x0 + nrm.x * rad;
      phist[pb + j * 3 + 1] = y0 + nrm.y * rad;
      phist[pb + j * 3 + 2] = z0 + nrm.z * rad;
    }
    phist[pb] += nrm.x * 1.4; phist[pb + 1] += nrm.y * 1.4; phist[pb + 2] += nrm.z * 1.4;
    peel[pickI] = 1; page[pickI] = 2.6 + rand() * 0.6;
  }
}
for (let n = 0; n < 110; n++) step(1 / 60);
shear();
for (let n = 0; n < 36; n++) step(1 / 60);
whip = 0;
let nextShear = simT + 14;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.FogExp2(pal.bg, 0.006);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(0, 8, 48);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.55;
function frameCam() {
  let minX = 1e9, minY = 1e9, minZ = 1e9, maxX = -1e9, maxY = -1e9, maxZ = -1e9;
  for (let i = 0; i < CORDS * L; i++) {
    const x = hist[i * 3], y = hist[i * 3 + 1], z = hist[i * 3 + 2];
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
  const sx = maxX - minX, sy = maxY - minY, sz = maxZ - minZ;
  const span = Math.max(sx, sy, sz, 8);
  const dist = span / (1.2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  const tall = sy >= sx && sy >= sz;
  const dx = tall ? 0.38 : 0.12, dy = tall ? 0.06 : 0.92, dz = tall ? 1 : 0.38;
  const dl = Math.hypot(dx, dy, dz);
  camera.position.set(cx + dist * dx / dl, cy + dist * dy / dl, cz + dist * dz / dl);
  controls.target.set(cx, cy, cz);
  camera.lookAt(cx, cy, cz);
}
frameCam();
controls.update();
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const cam = q.get('cam'); if (cam) { const [x, y, z, tx, ty, tz] = cam.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
  vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
mesh.frustumCulled = false;
scene.add(mesh);

const eye = new THREE.Vector3();
const pts = new Float32Array(L * 3);
function basis(tx, ty, tz, twist) {
  let ux = 0, uy = 1, uz = 0;
  if (Math.abs(ty) > 0.9) ux = 1, uy = 0;
  let nx = uy * tz - uz * ty, ny = uz * tx - ux * tz, nz = ux * ty - uy * tx;
  const nl = Math.hypot(nx, ny, nz) || 1;
  nx /= nl; ny /= nl; nz /= nl;
  const bx = ty * nz - tz * ny, by = tz * nx - tx * nz, bz = tx * ny - ty * nx;
  const cs = Math.cos(twist), sn = Math.sin(twist);
  nrm.set(nx * cs + bx * sn, ny * cs + by * sn, nz * cs + bz * sn);
  bin.set(bx * cs - nx * sn, by * cs - ny * sn, bz * cs - nz * sn);
}
function strandPoints(i) {
  const c = Math.floor(i / STRANDS), sIdx = i % STRANDS, rad = 0.62 + sIdx * 0.18;
  if (peel[i]) { for (let j = 0; j < L * 3; j++) pts[j] = phist[i * L * 3 + j]; return; }
  const base = c * L * 3;
  let px = 0, py = 1, pz = 0;
  for (let j = 0; j < L; j++) {
    const h = base + j * 3;
    const nJ = layout === 'RING' ? (j + 1) % L : Math.min(j + 1, L - 1);
    const x0 = hist[h], y0 = hist[h + 1], z0 = hist[h + 2];
    let dx = x0 - hist[base + nJ * 3], dy = y0 - hist[base + nJ * 3 + 1], dz = z0 - hist[base + nJ * 3 + 2];
    const dl = Math.hypot(dx, dy, dz) || 1;
    const tx = dx / dl, ty = dy / dl, tz = dz / dl;
    const dot = px * tx + py * ty + pz * tz;
    px -= tx * dot; py -= ty * dot; pz -= tz * dot;
    let nl = Math.hypot(px, py, pz);
    if (nl < 1e-4) { px = 1; py = 0; pz = 0; nl = 1; }
    px /= nl; py /= nl; pz /= nl;
    const bx = ty * pz - tz * py, by = tz * px - tx * pz, bz = tx * py - ty * px;
    const tw = twistAt(j, sIdx), cs = Math.cos(tw), sn = Math.sin(tw);
    pts[j * 3] = x0 + (px * cs + bx * sn) * rad;
    pts[j * 3 + 1] = y0 + (py * cs + by * sn) * rad;
    pts[j * 3 + 2] = z0 + (pz * cs + bz * sn) * rad;
  }
}
function writeRibbons() {
  eye.copy(camera.position);
  for (let i = 0; i < N; i++) {
    strandPoints(i);
    const hot = peel[i] ? 1 : 0.92;
    for (let j = 0; j < SEG; j++) {
      const x0 = pts[j * 3], y0 = pts[j * 3 + 1], z0 = pts[j * 3 + 2];
      const x1 = pts[j * 3 + 3], y1 = pts[j * 3 + 4], z1 = pts[j * 3 + 5];
      const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
      const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, mz = (z0 + z1) / 2;
      let sx = dy * (mz - eye.z) - dz * (my - eye.y);
      let sy = dz * (mx - eye.x) - dx * (mz - eye.z);
      let sz = dx * (my - eye.y) - dy * (mx - eye.x);
      const sl = Math.hypot(sx, sy, sz) || 1;
      const w = (peel[i] ? 0.12 : 0.26) * (0.55 + 0.45 * (1 - j / L));
      const wA = Math.min(w / sl, 0.42), wB = Math.min(w * 0.92 / sl, 0.42);
      const o = (i * SEG + j) * 18;
      const v = [x0 + sx * wA, y0 + sy * wA, z0 + sz * wA, x0 - sx * wA, y0 - sy * wA, z0 - sz * wA,
        x1 + sx * wB, y1 + sy * wB, z1 + sz * wB, x0 - sx * wA, y0 - sy * wA, z0 - sz * wA,
        x1 - sx * wB, y1 - sy * wB, z1 - sz * wB, x1 + sx * wB, y1 + sy * wB, z1 + sz * wB];
      for (let k = 0; k < 18; k++) pos[o + k] = v[k];
      const fade = (layout === 'RING' && !peel[i] ? 0.82 : Math.pow(1 - j / L, 1.35)) * hot;
      col.copy(stops[(i + (peel[i] ? 1 : 0)) % stops.length]).multiplyScalar(fade);
      for (let e = 0; e < 6; e++) { colA[o + e * 3] = col.r; colA[o + e * 3 + 1] = col.g; colA[o + e * 3 + 2] = col.b; }
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
}

let eventText = '', eventAt = -1e9, paused = false;
const info = document.getElementById('info');
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') { shear(); eventText = 'SHEAR'; eventAt = performance.now(); nextShear = simT + 5.2; }
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `038_braid-shear_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});

let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (simT > nextShear) { shear(); eventText = 'SHEAR'; eventAt = now; nextShear = simT + 5.4 + rand() * 1.6; }
    step(Math.min(dt, 1 / 50));
    writeRibbons();
  }
  controls.update(); renderer.render(scene, camera);
  const flash = now - eventAt < 1800 ? `\n${eventText}` : '';
  info.textContent = `038 · BRAID SHEAR · ${layout} · ${STRANDS} · ${pitchName} · ${pal.name} · seed ${seed}${flash}`;
});
</script>
</body>
</html>
