<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>001 — Life Strata</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.45); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const RULES = [
  ['B3/S23',    [3],       [2, 3]],
  ['B3/S23',    [3],       [2, 3]],
  ['B36/S23',   [3, 6],    [2, 3]],
  ['B368/S245', [3, 6, 8], [2, 4, 5]],
  ['B3/S45678', [3],       [4, 5, 6, 7, 8]],
];
const PALETTES = [
  { name: '藍と朱', bg: '#0b1020', c: ['#1d3557', '#e63946', '#f6efe4'] },
  { name: '墨と金', bg: '#0a0a0a', c: ['#2a2622', '#b08d57', '#f4e9d8'] },
  { name: '苔庭',   bg: '#0c1611', c: ['#23433a', '#8fb996', '#f0ead2'] },
  { name: '夜桜',   bg: '#100b18', c: ['#3a2e5c', '#d77fa1', '#fbe7e9'] },
];
const [ruleName, BORN, SURV] = pick(RULES);
const pal = pick(PALETTES);

// --- Life を積層して時空を作る ---
const N = 80, G = 150, H = 0.42;
const radius = N * (0.18 + rand() * 0.14), density = 0.28 + rand() * 0.2;
let grid = new Uint8Array(N * N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const d = Math.hypot(x - N / 2, y - N / 2);
  if (d < radius && rand() < density * (1 - d / radius * 0.5)) grid[y * N + x] = 1;
}
const layers = [];
for (let g = 0; g < G; g++) {
  layers.push(grid);
  const next = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (dx || dy) n += grid[((y + dy + N) % N) * N + (x + dx + N) % N];
    next[y * N + x] = grid[y * N + x] ? +SURV.includes(n) : +BORN.includes(n);
  }
  grid = next;
}

// --- three.js ---
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 90, 190);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 500);
// ?????????????????????
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(35) / 2) / Math.pow(camera.aspect, 0.6))) : 35; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(95, G * H * 0.95, 95);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, G * H * 0.45, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.4);
sun.position.set(60, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, far: 300 });
scene.add(sun);

let count = 0;
for (const L of layers) for (const v of L) count += v;
const mesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.92, H, 0.92),
  new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 }),
  count);
mesh.castShadow = mesh.receiveShadow = true;

const m = new THREE.Matrix4(), col = new THREE.Color();
const c0 = new THREE.Color(pal.c[0]), c1 = new THREE.Color(pal.c[1]), c2 = new THREE.Color(pal.c[2]);
let i = 0;
layers.forEach((L, g) => {
  const t = g / (G - 1);
  if (t < 0.6) col.lerpColors(c0, c1, t / 0.6); else col.lerpColors(c1, c2, (t - 0.6) / 0.4);
  for (let k = 0; k < N * N; k++) if (L[k]) {
    const born = g > 0 && !layers[g - 1][k];
    m.makeTranslation(k % N - N / 2, g * H, Math.floor(k / N) - N / 2);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, born ? col.clone().offsetHSL(0, 0, 0.08) : col);
    i++;
  }
});
mesh.count = 0;
scene.add(mesh);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -H / 2;
ground.receiveShadow = true;
scene.add(ground);

document.getElementById('info').textContent = `001 · LIFE STRATA · ${ruleName} · ${pal.name} · seed ${seed}`;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 's') {
    const a = document.createElement('a');
    a.download = `001_life-strata_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click();
  }
});

const t0 = performance.now();
renderer.setAnimationLoop(() => {
  const p = Math.min(1, (performance.now() - t0) / 6000);
  mesh.count = Math.floor(count * (1 - Math.pow(1 - p, 3)));
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
