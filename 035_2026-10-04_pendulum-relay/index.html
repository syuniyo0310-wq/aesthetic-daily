<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Pendulum Relay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALS = [
  { name: 'Ink', bg: '#07080c', arm: '#8d93a3', c: ['#f2e6c4', '#e07a4a', '#7eb6ff', '#f4f7fb'] },
  { name: 'Night', bg: '#07060c', arm: '#6e6488', c: ['#e7d4ff', '#ff7aa2', '#f0c36a', '#b9fff0'] },
  { name: 'Moss', bg: '#070c09', arm: '#6d7a68', c: ['#e7f0d8', '#d2a24c', '#7dcea0', '#f4fff6'] },
];
const pal = pick(PALS);
const N = pick([7, 9, 12]);
const PAT = pick(['relay', 'clash', 'pairs']);
const TEMPO = pick([1.05, 1.4, 1.8]);
const CATCH = pick([0.95, 1.35, 1.85]);
const LEN = pick(['even', 'cresc', 'odd']);
const AMP = pick([0.5, 0.72, 0.95]);
const lenAt = (i) => LEN === 'cresc' ? 1.8 + (i / (N - 1)) * 1.6 : LEN === 'odd' ? (i % 2 ? 3.2 : 1.9) : 2.2 + ((i * 3) % 4) * 0.16;
const R = pick([3.6, 4.6, 5.6]);
const CHORD = 2 * R * Math.sin(Math.PI / N);
const stops = pal.c.map((h) => new THREE.Color(h));
const col = new THREE.Color();
const ramp = (t) => { t = Math.min(0.999, Math.max(0, t)) * (stops.length - 1); const i = Math.floor(t); return col.copy(stops[i]).lerp(stops[i + 1], t - i); };
const armC = new THREE.Color(pal.arm), beadC = new THREE.Color();

const arms = [];
for (let i = 0; i < N; i++) {
  const len = lenAt(i);
  const az = (i / N) * Math.PI * 2;
  const ph = PAT === 'relay' ? -i * 0.55 : PAT === 'pairs' ? (i % 2) * Math.PI : i * 1.9;
  arms.push({
    x: Math.cos(az) * R, y: 2.4, z: Math.sin(az) * R, az,
    len, w: TEMPO * (0.94 + (i % 3) * 0.05), ph, amp: AMP,
  });
}
const balls = [];
function addBall(arm) { balls.push({ mode: 'hold', arm, sent: false, flung: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, id: balls.length }); }
addBall(0); addBall(Math.floor(N / 2)); addBall(N - 1);
const beads = [];
let passes = 0, misses = 0, simT = 0, rush = 0;

function bob(i, t) {
  const a = arms[i];
  const th = a.amp * Math.sin(a.w * t + a.ph);
  const dth = a.amp * a.w * Math.cos(a.w * t + a.ph);
  const s = Math.sin(th) * a.len;
  return { th, dth, x: a.x - Math.sin(a.az) * s, y: a.y - Math.cos(th) * a.len, z: a.z + Math.cos(a.az) * s };
}
function bead(x, y, z, hue) {
  beads.push({ x, y, z, hue, life: 0 });
  if (beads.length > 70) beads.shift();
}
function step(dt) {
  simT += dt;
  if (rush > 0) rush -= dt;
  const tempo = rush > 0 ? 1.65 : 1;
  const t = simT * tempo;
  for (const b of balls) {
    if (b.mode === 'hold') {
      const o = bob(b.arm, t);
      b.x = o.x; b.y = o.y; b.z = o.z;
      if (Math.abs(o.th) > 0.55) { b.sent = false; b.flung = false; }
      const last = b.arm === N - 1;
      if (last && !b.flung && Math.abs(o.th) < 0.3 && o.dth > 0) {
        b.flung = true; b.mode = 'fly'; b.arm = -1;
        const home = bob(0, t);
        b.vx = (home.x - o.x) / 0.85; b.vy = 3.4; b.vz = (home.z - o.z) / 0.85;
        bead(b.x, b.y, b.z, 0.85);
      } else if (!last && !b.sent && Math.abs(o.th) < 0.28 && o.dth > 0.15) {
        b.sent = true;
        const n = bob(b.arm + 1, t);
        const dist = Math.hypot(o.x - n.x, o.y - n.y, o.z - n.z);
        if (dist < CHORD + CATCH * 0.35 && Math.abs(n.th) < 0.5) {
          b.mode = 'hop'; b.to = b.arm + 1; b.t = 0;
          b.vx = (n.x - o.x) / 0.22; b.vy = (n.y - o.y) / 0.22 + 1.4; b.vz = (n.z - o.z) / 0.22;
          passes++; bead(o.x, o.y - 0.2, o.z, b.id / 5);
        } else misses++;
      }
    } else if (b.mode === 'hop') {
      b.t += dt; b.vy -= 8 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      if (b.t > 0.22) { b.mode = 'hold'; b.arm = b.to; b.sent = true; b.flung = false; }
    } else {
      b.vy -= 9 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      const home = bob(0, t);
      if (Math.hypot(b.x - home.x, b.z - home.z) < 0.9 && Math.abs(b.y - home.y) < 1.3) {
        b.mode = 'hold'; b.arm = 0; b.sent = true; b.flung = false; passes++; bead(home.x, home.y, home.z, 0.15);
      } else if (b.y < -3.2) {
        b.mode = 'hold'; b.arm = 0; b.sent = false; b.flung = false;
      }
    }
  }
  for (const d of beads) { d.life += dt; d.y = Math.max(-1.15, d.y - 0.7 * dt); }
  for (let i = beads.length - 1; i >= 0; i--) if (beads[i].life > 8) beads.splice(i, 1);
}
for (let n = 0; n < 90; n++) step(1 / 60);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.FogExp2(pal.bg, 0.014);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov();
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.28;
camera.position.set(R * 0.15, R * 1.15, R * 2.15);
controls.target.set(0, 0.3, 0);
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [a, b, d, tx, ty, tz] = c.split(',').map(Number); if ([a, b, d].every(Number.isFinite)) window.__view.set({ x: a, y: b, z: d, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(6, 12, 8); scene.add(dir);
const rail = new THREE.Mesh(new THREE.TorusGeometry(R, 0.045, 8, 72), new THREE.MeshStandardMaterial({ color: pal.arm, roughness: 0.4, metalness: 0.5 }));
rail.rotation.x = Math.PI / 2; rail.position.y = 2.4; scene.add(rail);

const armsM = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.45 }), N);
const bobsM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.16, 12, 10), new THREE.MeshStandardMaterial({ color: pal.arm, roughness: 0.3, metalness: 0.6 }), N);
const ballsM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.26, 16, 12), new THREE.MeshStandardMaterial({ roughness: 0.22, metalness: 0.4, emissive: 0x22180c, emissiveIntensity: 0.5 }), 8);
const beadsM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.14, 8, 6), new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.15 }), 70);
for (const m of [armsM, ballsM, beadsM]) { m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(m.count * 3), 3); }
for (const m of [armsM, bobsM, ballsM, beadsM]) { m.frustumCulled = false; scene.add(m); }
const dummy = new THREE.Object3D();

function draw() {
  const tempo = rush > 0 ? 1.65 : 1;
  const t = simT * tempo;
  arms.forEach((a, i) => {
    const o = bob(i, t);
    dummy.position.set((a.x + o.x) / 2, (a.y + o.y) / 2, (a.z + o.z) / 2);
    dummy.lookAt(o.x, o.y, o.z);
    dummy.scale.set(0.11, 0.11, a.len);
    dummy.updateMatrix();
    armsM.setMatrixAt(i, dummy.matrix);
    armC.set(pal.arm).lerp(ramp(i / N), 0.35);
    armsM.setColorAt(i, armC);
    dummy.position.set(o.x, o.y, o.z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
    bobsM.setMatrixAt(i, dummy.matrix);
  });
  armsM.instanceMatrix.needsUpdate = armsM.instanceColor.needsUpdate = true;
  bobsM.instanceMatrix.needsUpdate = true;
  balls.forEach((b, i) => {
    dummy.position.set(b.x, b.y, b.z); dummy.scale.set(1, 1, 1); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
    ballsM.setMatrixAt(i, dummy.matrix); ballsM.setColorAt(i, ramp((b.id % 4) / 4));
  });
  ballsM.count = balls.length; ballsM.instanceMatrix.needsUpdate = ballsM.instanceColor.needsUpdate = true;
  beads.forEach((d, i) => {
    const k = Math.max(0.35, 1 - d.life / 8);
    dummy.position.set(d.x, d.y, d.z); dummy.scale.set(k, k, k); dummy.updateMatrix();
    beadsM.setMatrixAt(i, dummy.matrix);
    beadC.copy(ramp(d.hue)).multiplyScalar(0.55 + 0.45 * k);
    beadsM.setColorAt(i, beadC);
  });
  beadsM.count = beads.length; beadsM.instanceMatrix.needsUpdate = beadsM.instanceColor.needsUpdate = true;
}
draw();
window.__dbg = () => ({ n: N, pat: PAT, r: R, passes, misses, beads: beads.length, balls: balls.map((b) => b.mode + ':' + b.arm) });

let ev = '', evAt = -1e9, next = performance.now() + 7000, paused = false;
function fire() {
  rush = 2.8;
  if (balls.length < 6) addBall(0);
  ev = 'RUSH'; evAt = performance.now(); next = evAt + 7000 + rand() * 3500;
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') fire();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `035_pendulum-relay_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
const hud = document.getElementById('info');
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (now > next) fire();
    step(dt); draw();
  }
  controls.update(); renderer.render(scene, camera);
  hud.textContent = `035 · PENDULUM RELAY · ${PAT} · ${N} arms · ${pal.name} · seed ${seed}\nPASS ${passes}${now - evAt < 2200 ? '  ' + ev : ''}`;
});
</script>
</body>
</html>
