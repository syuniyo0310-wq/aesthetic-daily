<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Lightcone Loom</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0b0c12;overflow:hidden}
canvas{display:block;image-rendering:pixelated}
#hud{position:fixed;left:10px;bottom:8px;font:10px monospace;color:#888;letter-spacing:.08em;pointer-events:none;text-shadow:0 0 3px #000}</style>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head><body><canvas id="c"></canvas><div id="hud"></div>
<script>
const q = new URLSearchParams(location.search);
const seed = +(q.get('seed') || Math.floor(Math.random() * 1e5));
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(seed);

// パステルの環（世代でゆっくり一周する）と、外側の暗い地
const PALS = [
  { name: 'Dawn',   bg: '#0c0d15', c: ['#f7c5d0', '#f9e0ae', '#c9e4c5', '#b5d8f0', '#d4c1ec'] },
  { name: 'Ukiyo',  bg: '#10141a', c: ['#efe0bd', '#e8957a', '#7fb0c4', '#a9cbb7', '#f4efe4'] },
  { name: 'Neon Pastel', bg: '#0a0a14', c: ['#ff9ad5', '#9af0ff', '#d7ff9a', '#ffe59a', '#b69aff'] },
  { name: 'Sumi & Gold', bg: '#0e0d0c', c: ['#f1e6c8', '#d9b66c', '#a89a84', '#e9d2a0', '#c7b9a0'] },
];
const pal = PALS[Math.floor(rnd() * PALS.length)];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const ST = pal.c.map(hex), BG = hex(pal.bg);
function ring(t, o) {
  t = ((t % 1) + 1) % 1 * ST.length;
  const i = Math.floor(t), f = t - i, a = ST[i], b = ST[(i + 1) % ST.length];
  const s = f * f * (3 - 2 * f);
  o[0] = a[0] + (b[0] - a[0]) * s; o[1] = a[1] + (b[1] - a[1]) * s; o[2] = a[2] + (b[2] - a[2]) * s;
}

const RULES = [150, 126, 54, 122, 90, 182];
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, cell, buf, bctx, rowImg, A, A2, B, B2, T, T2, IN, IN2, AG, mask;
let r1, r2, mix, gen = 0, epochRow = 0, epochLen = 0, hueOff = rnd(), extraSeeds = 0;

function pickRule(not) { let r; do r = RULES[Math.floor(rnd() * RULES.length)]; while (r === not); return r; }
function smoothMask() {
  // 縦縞の帯ごとに規則が切り替わるよう、なめらかな1Dノイズで列の順番を決める
  const k = 3 + Math.floor(rnd() * 5), ph = [], am = [];
  for (let i = 0; i < k; i++) { ph.push(rnd() * 6.28); am.push(rnd()); }
  let lo = 1e9, hi = -1e9;
  for (let x = 0; x < W; x++) {
    let v = 0; for (let i = 0; i < k; i++) v += am[i] * Math.sin((x / W) * (i + 1) * 3.1 + ph[i]);
    mask[x] = v; lo = Math.min(lo, v); hi = Math.max(hi, v);
  }
  for (let x = 0; x < W; x++) mask[x] = (mask[x] - lo) / (hi - lo + 1e-9);
}
function plant(x) { A[x] = 1; if (!IN[x]) AG[x] = 0; IN[x] = 1; }
function newEpoch() {
  A.fill(0); IN.fill(0); T.fill(0); AG.fill(0);
  const n = rnd() < 0.6 ? 1 : 2;
  if (n === 1) plant(W >> 1);
  else { plant(Math.floor(W * (0.3 + rnd() * 0.1))); plant(Math.floor(W * (0.6 + rnd() * 0.1))); }
  epochRow = 0;
  epochLen = Math.floor(W * (0.55 + rnd() * 0.5));
  hueOff += 0.18 + rnd() * 0.2;
  extraSeeds = rnd() < 0.7 ? 1 + Math.floor(rnd() * 2) : 0;
}

function setup() {
  cell = Math.max(2, Math.round(Math.min(innerWidth, innerHeight * 1.25) / 380));
  W = Math.ceil(innerWidth / cell); H = Math.ceil(innerHeight / cell);
  cv.width = innerWidth; cv.height = innerHeight;
  buf = document.createElement('canvas'); buf.width = W; buf.height = H; bctx = buf.getContext('2d');
  bctx.fillStyle = pal.bg; bctx.fillRect(0, 0, W, H);
  rowImg = bctx.createImageData(W, 1);
  A = new Uint8Array(W); A2 = new Uint8Array(W); B = new Uint8Array(W); B2 = new Uint8Array(W);
  T = new Float32Array(W); T2 = new Float32Array(W); IN = new Uint8Array(W); IN2 = new Uint8Array(W);
  mask = new Float32Array(W); AG = new Float32Array(W);
  for (let x = 0; x < W; x++) B[x] = rnd() < 0.5 ? 1 : 0;
  r1 = pickRule(0); r2 = pickRule(r1); mix = 0; smoothMask();
  newEpoch();
  for (let y = 0; y < H; y++) step();
}

// 端は反射（外の隣はその列自身）
const col = [0, 0, 0], col2 = [0, 0, 0];
function step() {
  const d = rowImg.data;
  for (let x = 0; x < W; x++) {
    const l = x > 0 ? x - 1 : 0, r = x < W - 1 ? x + 1 : W - 1;
    const rule = mask[x] < mix ? r2 : r1;
    A2[x] = (rule >> ((A[l] << 2) | (A[x] << 1) | A[r])) & 1;
    B2[x] = (54 >> ((B[l] << 2) | (B[x] << 1) | B[r])) & 1;
    IN2[x] = IN[l] | IN[x] | IN[r];
    let t = 0.25 * T[l] + 0.5 * T[x] + 0.25 * T[r];
    t = t * 0.992 + (A2[x] ? (1 - t) * 0.05 : 0);
    T2[x] = t;
  }
  for (let x = 0; x < W; x++) AG[x] = IN2[x] ? (IN[x] ? AG[x] + 1 : 0) : 0;
  [A, A2] = [A2, A]; [B, B2] = [B2, B]; [T, T2] = [T2, T]; [IN, IN2] = [IN2, IN];
  const hue = hueOff + gen * 0.0012;
  for (let x = 0; x < W; x++) {
    const o = x * 4, u = x / W;
    if (IN[x]) {
      // 光円錐の縁ほど細密な帯、奥ほど静かなグラデーション
      const ag = AG[x], amp = 0.06 + 0.6 * Math.exp(-ag / 34);
      ring(hue + u * 0.1 + T[x] * 0.12 + ag * 0.0016, col);
      const k = (0.74 + 0.16 * T[x]) * (A[x] ? 1 - amp * 0.15 : 1 - amp);
      d[o] = BG[0] + (col[0] - BG[0]) * k; d[o + 1] = BG[1] + (col[1] - BG[1]) * k; d[o + 2] = BG[2] + (col[2] - BG[2]) * k;
    } else {
      ring(hue + 0.3 + u * 0.4, col2);
      const k = B[x] ? 0.1 : 0.02;
      d[o] = BG[0] + (col2[0] - BG[0]) * k; d[o + 1] = BG[1] + (col2[1] - BG[1]) * k; d[o + 2] = BG[2] + (col2[2] - BG[2]) * k;
    }
    d[o + 3] = 255;
  }
  bctx.drawImage(buf, 0, -1);
  bctx.putImageData(rowImg, 0, H - 1);

  gen++; epochRow++;
  mix += 1 / 260;
  if (mix >= 1) { r1 = r2; r2 = pickRule(r1); mix = 0; smoothMask(); }
  if (extraSeeds > 0 && epochRow > W * 0.12 && rnd() < 0.012) { plant(Math.floor(W * (0.1 + rnd() * 0.8))); extraSeeds--; }
  if (epochRow > epochLen) newEpoch();
}

let paused = false, acc = 0;
const hud = document.getElementById('hud');
function loop() {
  requestAnimationFrame(loop);
  if (!paused) { acc += 0.8; while (acc >= 1) { step(); acc--; } }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, W * cell, H * cell);
  if (gen % 20 === 0) hud.textContent = `024 · LIGHTCONE LOOM · ${pal.name} · rules ${r1}→${r2} · seed ${seed}`;
}
setup(); loop();

addEventListener('resize', setup);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') { q.set('seed', Math.floor(Math.random() * 1e5)); location.search = q.toString(); }
  else if (k === 's') { const a = document.createElement('a'); a.download = `024_lightcone-loom_${seed}.png`; a.href = cv.toDataURL('image/png'); a.click(); }
  else if (k === 'e') plant(Math.floor(W * (0.1 + rnd() * 0.8)));
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
});
</script></body></html>
