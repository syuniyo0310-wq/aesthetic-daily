<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Apex Lattice</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALS = [
  { name: 'Ink', bg: '#07080c', c: ['#f3ecdf', '#e0b15a', '#8fd0ff'] },
  { name: 'Night', bg: '#06060a', c: ['#d9d4ff', '#ffd36a', '#9be7c4'] },
  { name: 'Ember', bg: '#0c0806', c: ['#ffe1c2', '#ff7a45', '#f2f2f2'] },
];
const pal = pick(PALS);
const col = pal.c.map((h) => new THREE.Color(h));
const MAX = 8000;
let depth = 2, focus = 0;
const boxes = [];
function lace(h, i) { return (i & h) === i || (h & 3) === 0; }
function pyramid(level, x, y, z, size, hue) {
  if (boxes.length > MAX - 8) return;
  if (level <= 0 || size < 3) {
    for (let h = 0; h < size; h++) {
      const w = size - h;
      const y0 = y + h * 0.42;
      for (let i = 0; i < w; i++) {
        if (!lace(h + 1, i)) continue;
        const o = (w - 1) * 0.5;
        const ring = [[x + (i - o) * 0.42, z + (0 - o) * 0.42], [x + (i - o) * 0.42, z + (w - 1 - o) * 0.42],
          [x + (0 - o) * 0.42, z + (i - o) * 0.42], [x + (w - 1 - o) * 0.42, z + (i - o) * 0.42]];
        for (const [px, pz] of ring) boxes.push({ x: px, y: y0, z: pz, hue, edge: i === 0 || i === w - 1 });
      }
    }
    return;
  }
  const s = size / 2, lift = s * 0.42;
  pyramid(level - 1, x, y + lift, z, s, hue);
  pyramid(level - 1, x - s * 0.22, y, z - s * 0.22, s, (hue + 1) % 3);
  pyramid(level - 1, x + s * 0.22, y, z - s * 0.22, s, (hue + 1) % 3);
  pyramid(level - 1, x - s * 0.22, y, z + s * 0.22, s, (hue + 2) % 3);
  pyramid(level - 1, x + s * 0.22, y, z + s * 0.22, s, (hue + 2) % 3);
}
function rebuild() { boxes.length = 0; pyramid(depth, 0, 0, 0, 18, focus % 3); }
rebuild();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.FogExp2(pal.bg, 0.018);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov(); camera.position.set(11, 8, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 4.2, 0); controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [a, b, d, tx, ty, tz] = c.split(',').map(Number); if ([a, b, d].every(Number.isFinite)) window.__view.set({ x: a, y: b, z: d, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(10, 18, 8); scene.add(dir);

const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.38, metalness: 0.28 }), MAX);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX * 3), 3);
mesh.frustumCulled = false; scene.add(mesh);
const dummy = new THREE.Object3D();
function draw() {
  const n = Math.min(boxes.length, MAX);
  for (let i = 0; i < n; i++) {
    const b = boxes[i];
    dummy.position.set(b.x, b.y, b.z);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(b.edge ? 0.34 : 0.2, b.edge ? 0.34 : 0.12, b.edge ? 0.34 : 0.2);
    dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
    mesh.setColorAt(i, col[b.hue % col.length]);
  }
  mesh.count = Math.max(1, n);
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
}
draw();

let paused = false, flash = '', flashAt = -1e9, when = performance.now() + 8000;
function bud() {
  focus = (focus + 1) % 3;
  depth = depth === 2 ? 3 : 2;
  rebuild();
  flash = depth === 3 ? 'DEEPER' : 'FOUR'; flashAt = performance.now(); when = flashAt + 7000 + rand() * 2000;
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') bud();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `030_apex-lattice_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
const hud = document.getElementById('info');
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused && now > when) bud();
  controls.update(); renderer.render(scene, camera);
  hud.textContent = `030 · APEX LATTICE · depth ${depth} · ${pal.name} · seed ${seed}${now - flashAt < 1600 ? '\n' + flash : ''}`;
});
</script></body></html>
