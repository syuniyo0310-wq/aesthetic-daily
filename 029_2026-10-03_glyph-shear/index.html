<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Glyph Shear</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALS = [
  { name: 'Neon', bg: '#07060b', c: ['#ff4fa3', '#7dfff2', '#ffe56a'] },
  { name: 'Ink', bg: '#07080c', c: ['#f4efe4', '#d7a15a', '#7ec8ff'] },
  { name: 'Ember', bg: '#0c0706', c: ['#ffb088', '#ff5a36', '#ffe7c2'] },
];
const pal = pick(PALS);
const col = pal.c.map((h) => new THREE.Color(h));
const RULES = [90, 150, 30];
let rule = pick(RULES);

const seg = (ax, ay, bx, by, n) => {
  const o = [], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
  for (let i = 0; i < n; i++) {
    const t = i / n;
    o.push({ x: ax + dx * t, y: ay + dy * t, tx: dx / L, ty: dy / L });
  }
  return o;
};
const arc = (cx, cy, r, a0, a1, n) => {
  const o = [];
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * (i / n);
    o.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, tx: -Math.sin(a), ty: Math.cos(a) });
  }
  return o;
};
const GLYPHS = [
  { name: 'A', pts: [...seg(0, 0, 4, 14, 16), ...seg(8, 0, 4, 14, 16), ...seg(1.7, 5, 6.3, 5, 8)] },
  { name: 'E', pts: [...seg(0, 0, 0, 14, 16), ...seg(0, 14, 7, 14, 8), ...seg(0, 7, 5.4, 7, 7), ...seg(0, 0, 7, 0, 8)] },
  { name: 'S', pts: [...arc(4, 10.2, 3.3, Math.PI * 0.15, Math.PI * 1.15, 18), ...arc(4, 3.6, 3.3, Math.PI * 1.15, Math.PI * 2.15, 18)] },
  { name: 'O', pts: arc(4, 7, 5.2, 0, Math.PI * 2, 36) },
  { name: 'N', pts: [...seg(0, 0, 0, 14, 16), ...seg(0, 14, 8, 0, 18), ...seg(8, 0, 8, 14, 16)] },
  { name: 'M', pts: [...seg(0, 0, 0, 14, 14), ...seg(0, 14, 4, 5, 12), ...seg(8, 14, 4, 5, 12), ...seg(8, 14, 8, 0, 14)] },
];
let gi = Math.floor(rand() * GLYPHS.length), path = [];
function centerPath() {
  const g = GLYPHS[gi];
  let cx = 0, cy = 0;
  for (const p of g.pts) { cx += p.x; cy += p.y; }
  cx /= g.pts.length; cy /= g.pts.length;
  path = g.pts.map((p) => ({ x: (p.x - cx) * 1.35, y: (p.y - cy) * 1.35, tx: p.tx, ty: p.ty }));
}
centerPath();

const W = 48;
let cells = new Uint8Array(W);
cells[Math.floor(W / 2)] = 1;
for (let i = 0; i < 8; i++) if (rand() < 0.4) cells[Math.floor(rand() * W)] = 1;
function ca() {
  const n = new Uint8Array(W);
  for (let i = 0; i < W; i++) {
    const idx = (cells[(i + W - 1) % W] << 2) | (cells[i] << 1) | cells[(i + 1) % W];
    n[i] = (rule >> idx) & 1;
  }
  cells = n;
  if (cells.reduce((a, b) => a + b, 0) < 18) for (let i = 0; i < W; i += 2) cells[i] = 1;
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.FogExp2(pal.bg, 0.02);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov(); camera.position.set(0, 2, 36);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.35;
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [a, b, d, tx, ty, tz] = c.split(',').map(Number); if ([a, b, d].every(Number.isFinite)) window.__view.set({ x: a, y: b, z: d, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const dir = new THREE.DirectionalLight(0xffffff, 0.85); dir.position.set(8, 16, 12); scene.add(dir);

const MAX = 2800;
const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.25 }), MAX);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX * 3), 3);
mesh.frustumCulled = false; scene.add(mesh);
const dummy = new THREE.Object3D();
const rail = new THREE.Color('#c8c2b8');
let flow = 0;
function draw() {
  const P = path.length;
  let n = 0;
  for (let i = 0; i < P && n < MAX; i++) {
    const p = path[i], u = (i / P + flow) % 1;
    const bit = cells[Math.floor(u * W) % W];
    const nx = -p.ty, ny = p.tx;
    dummy.position.set(p.x, p.y, 0);
    dummy.lookAt(p.x + p.tx, p.y + p.ty, 0);
    dummy.scale.set(0.28, 0.28, 1.35);
    dummy.updateMatrix(); mesh.setMatrixAt(n, dummy.matrix); mesh.setColorAt(n, rail); n++;
    const k = bit ? 5 + (cells[(Math.floor(u * W) + 1) % W] ? 3 : 0) : 1;
    for (let h = 1; h <= k && n < MAX; h++) {
      const peel = Math.sin(flow * 12 + i * 0.4) * 0.15 * h;
      dummy.position.set(p.x + nx * (h * 0.34 + peel), p.y + ny * (h * 0.34), peel * 0.8);
      dummy.lookAt(dummy.position.x + nx, dummy.position.y + ny, dummy.position.z);
      dummy.scale.set(0.16, 0.16, 0.42 + bit * 0.2);
      dummy.updateMatrix(); mesh.setMatrixAt(n, dummy.matrix);
      mesh.setColorAt(n, col[(h + gi) % col.length]); n++;
    }
  }
  mesh.count = Math.max(1, n);
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
}
draw();

let next = performance.now() + 6400, paused = false, acc = 0, flash = '', flashAt = -1e9;
function cut() {
  gi = (gi + 1) % GLYPHS.length; centerPath();
  rule = RULES[(RULES.indexOf(rule) + 1) % RULES.length];
  cells.fill(0); cells[Math.floor(W / 2)] = 1; cells[8] = 1; cells[W - 9] = 1;
  for (let i = 0; i < 12; i++) ca();
  flash = GLYPHS[gi].name; flashAt = performance.now(); next = flashAt + 5600 + rand() * 1800;
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') cut();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `029_glyph-shear_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
const hud = document.getElementById('info');
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (now > next) cut();
    flow = (flow + dt * 0.08) % 1;
    acc += dt; if (acc > 0.12) { ca(); acc = 0; }
    draw();
  }
  controls.update(); renderer.render(scene, camera);
  hud.textContent = `029 · GLYPH SHEAR · ${GLYPHS[gi].name} · rule ${rule} · ${pal.name} · seed ${seed}${now - flashAt < 1600 ? '\n' + flash : ''}`;
});
</script></body></html>
