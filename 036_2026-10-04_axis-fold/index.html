<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Axis Fold</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALS = [
  { name: 'Brass', bg: '#0b0a08', pipe: '#b7a48a', c: ['#f0d7a2', '#e07a3d', '#f4efe4', '#c45648'] },
  { name: 'Ink', bg: '#08090e', pipe: '#9aa4b8', c: ['#d5e4ff', '#7eb0ff', '#f2f5f8', '#e7c56a'] },
  { name: 'Pine', bg: '#070c0a', pipe: '#8ea394', c: ['#e7f2df', '#d2a24a', '#6fceb0', '#f7fff4'] },
];
const pal = pick(PALS);
const BOX = pick([4, 6, 8]);
const STEP = pick([1.15, 1.45, 1.8]);
const BIAS = pick(['tower', 'knot', 'slab']);
const CAP = 110;
const stops = pal.c.map((h) => new THREE.Color(h));
const col = new THREE.Color(), pipeC = new THREE.Color(pal.pipe);
const ramp = (t) => { t = Math.min(0.999, Math.max(0, t)) * (stops.length - 1); const i = Math.floor(t); return col.copy(stops[i]).lerp(stops[i + 1], t - i); };

const ORDER = BIAS === 'tower' ? [1, 0, 2, 1] : BIAS === 'slab' ? [0, 2, 0, 2, 1] : [0, 1, 2];
const RUN = pick([2, 3, 4]);
const segs = [];
const echoes = [];
const balls = [];
let x = 0, y = 0, z = 0, dx = 1, dy = 0, dz = 0;
let mode = 'fold', run = 0, axisI = 0, folds = 0, simT = 0, rush = 0, seq = 0;
const sign = [1, 1, 1];

function nextDir() {
  const lim = BOX * STEP;
  for (let guard = 0; guard < 6; guard++) {
    const axis = ORDER[axisI % ORDER.length];
    const d = [0, 0, 0];
    d[axis] = sign[axis];
    const nx = x + d[0] * STEP, ny = y + d[1] * STEP, nz = z + d[2] * STEP;
    const out = Math.abs(nx) > lim || Math.abs(ny) > lim || Math.abs(nz) > lim;
    if (out || run >= RUN) {
      if (out) sign[axis] *= -1;
      axisI++; run = 0; folds++;
      continue;
    }
    run++;
    return d;
  }
  return [sign[0], 0, 0];
}
function grow() {
  seq++;
  const dir = nextDir();
  const px = x, py = y, pz = z;
  dx = dir[0]; dy = dir[1]; dz = dir[2];
  x += dx * STEP; y += dy * STEP; z += dz * STEP;
  const axis = dx !== 0 ? 0 : dy !== 0 ? 1 : 2;
  segs.push({ x, y, z, px, py, pz, dx, dy, dz, v: 0, axis });
  if (segs.length > CAP) {
    const old = segs.shift();
    echoes.push({ x: old.x, y: old.y, z: old.z, px: old.px, py: old.py, pz: old.pz, life: 0, hue: (old.y / (BOX * STEP) + 1) * 0.5 });
    if (echoes.length > 60) echoes.shift();
    for (const b of balls) b.u -= 1;
  }
}
function stepBalls(dt) {
  const spm = rush > 0 ? 2.1 : 1;
  for (const b of balls) {
    if (segs.length < 4) continue;
    if (b.u < 1) b.u = 1;
    if (b.u > segs.length - 2) b.u = 2 + (b.id % 5);
    const i = Math.min(segs.length - 1, Math.floor(b.u));
    const downhill = segs[i].dy < -0.2 ? 6.5 : segs[i].dy > 0.2 ? 1.5 : 3.1;
    b.u += downhill * spm * dt;
    segs[Math.min(segs.length - 1, Math.floor(b.u))].v = Math.min(6, segs[i].v + dt * 1.6);
  }
}
function step(dt) {
  simT += dt;
  if (rush > 0) rush -= dt;
  for (const e of echoes) { e.life += dt; e.y -= 0.85 * dt; e.py -= 0.85 * dt; }
  for (let i = echoes.length - 1; i >= 0; i--) if (echoes[i].life > 7) echoes.splice(i, 1);
}
for (let i = 0; i < 8; i++) balls.push({ u: 4 + i * 7, id: i });
for (let n = 0; n < 70; n++) grow();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.FogExp2(pal.bg, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov();
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.4;
const Rcam = BOX * STEP + 2;
camera.position.set(Rcam * 1.65, Rcam * 1.05, Rcam * 1.85);
controls.target.set(0, 0, 0);
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [a, b, d, tx, ty, tz] = c.split(',').map(Number); if ([a, b, d].every(Number.isFinite)) window.__view.set({ x: a, y: b, z: d, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.AmbientLight(0xffffff, 0.52));
const dirL = new THREE.DirectionalLight(0xffffff, 0.85); dirL.position.set(10, 16, 8); scene.add(dirL);

const pipesM = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.22 }), CAP);
const echoM = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.7, metalness: 0.05 }), 60);
const ballsM = new THREE.InstancedMesh(new THREE.SphereGeometry(0.42, 16, 12), new THREE.MeshStandardMaterial({ roughness: 0.22, metalness: 0.35, emissive: 0x44280f, emissiveIntensity: 0.7 }), 8);
for (const m of [pipesM, echoM, ballsM]) { m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(m.count * 3), 3); m.frustumCulled = false; scene.add(m); }
const dummy = new THREE.Object3D(), end = new THREE.Vector3(), hueC = new THREE.Color(), aim = new THREE.Vector3();
function frame() {
  if (!segs.length) return;
  let cx = 0, cy = 0, cz = 0;
  for (const g of segs) { cx += g.x; cy += g.y; cz += g.z; }
  aim.set(cx / segs.length, cy / segs.length, cz / segs.length);
  camera.position.x += aim.x - controls.target.x;
  camera.position.y += aim.y - controls.target.y;
  camera.position.z += aim.z - controls.target.z;
  controls.target.copy(aim);
}

function putPipe(mesh, i, a, b, thick, color) {
  dummy.position.set((a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  end.set(b.x, b.y, b.z);
  dummy.lookAt(end);
  const len = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
  dummy.scale.set(thick, thick, Math.max(0.08, len));
  dummy.updateMatrix();
  mesh.setMatrixAt(i, dummy.matrix);
  mesh.setColorAt(i, color);
}
function draw() {
  segs.forEach((g, i) => {
    hueC.copy(pipeC).lerp(ramp(g.axis / 2), 0.82);
    putPipe(pipesM, i, g, { x: g.px, y: g.py, z: g.pz }, 0.34 + Math.min(0.28, g.v * 0.04), hueC);
  });
  pipesM.count = segs.length; pipesM.instanceMatrix.needsUpdate = pipesM.instanceColor.needsUpdate = true;
  echoes.forEach((e, i) => {
    const k = Math.max(0.3, 1 - e.life / 7);
    hueC.copy(ramp(e.hue)).multiplyScalar(k);
    putPipe(echoM, i, e, { x: e.px, y: e.py, z: e.pz }, 0.2, hueC);
  });
  echoM.count = echoes.length; echoM.instanceMatrix.needsUpdate = echoM.instanceColor.needsUpdate = true;
  balls.forEach((b, i) => {
    const i0 = Math.max(0, Math.min(segs.length - 2, Math.floor(b.u)));
    const f = b.u - i0;
    const a = segs[i0], c = segs[i0 + 1] || a;
    dummy.position.set(a.x + (c.x - a.x) * f, a.y + (c.y - a.y) * f, a.z + (c.z - a.z) * f);
    dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
    ballsM.setMatrixAt(i, dummy.matrix); ballsM.setColorAt(i, ramp(i / 8));
  });
  ballsM.count = balls.length; ballsM.instanceMatrix.needsUpdate = ballsM.instanceColor.needsUpdate = true;
}
draw(); frame();
window.__dbg = () => ({ box: BOX, step: STEP, bias: BIAS, mode, segs: segs.length, echoes: echoes.length, folds });

let ev = '', evAt = -1e9, paused = false, growAcc = 0;
function fire() { axisI++; run = RUN; sign[1] *= -1; rush = 2.4; mode = mode === 'fold' ? 'drop' : 'fold'; ev = 'FOLD'; evAt = performance.now(); }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') fire();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `036_axis-fold_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
const hud = document.getElementById('info');
let last = performance.now(), next = performance.now() + 7500;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (now > next) { fire(); next = now + 8000 + (seq % 5) * 500; }
    growAcc += dt * 7;
    let guard = 0;
    while (growAcc >= 1 && guard++ < 8) { grow(); growAcc--; }
    stepBalls(dt); step(dt); draw(); frame();
  }
  controls.update(); renderer.render(scene, camera);
  hud.textContent = `036 · AXIS FOLD · ${BIAS} · ${mode} · box ${BOX} · ${pal.name} · seed ${seed}${now - evAt < 2200 ? '\n' + ev : ''}`;
});
</script>
</body>
</html>
