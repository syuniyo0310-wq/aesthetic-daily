<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Controls — AI Aesthetic Artist</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 220px 1fr 300px;
         background: #0a0a0c; color: #cfd2d8; font: 12px/1.6 ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  aside, section { padding: 20px; overflow-y: auto; }
  h1 { font-size: 12px; font-weight: 400; letter-spacing: .3em; margin: 0 0 18px; opacity: .7; }
  h2 { font-size: 11px; font-weight: 400; letter-spacing: .2em; margin: 22px 0 8px; opacity: .5; }
  a { color: inherit; }
  .work { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 4px; border: 1px solid transparent;
          background: none; color: inherit; font: inherit; cursor: pointer; border-radius: 4px; }
  .work:hover { background: #16171b; }
  .work.on { border-color: #3a3d45; background: #16171b; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; }
  .endless { background: #173a2e; color: #7ff0c4; }
  .static { background: #2a2a36; color: #b3b6ff; }
  main { position: relative; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .key { display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px; margin-bottom: 6px;
         background: #121317; border: 1px solid #25272e; border-radius: 6px; color: inherit; font: inherit; cursor: pointer; text-align: left; }
  .key:hover { border-color: #4a4e59; }
  .key.flash { border-color: #7ff0c4; background: #16241f; }
  kbd { min-width: 52px; text-align: center; padding: 3px 8px; border: 1px solid #4a4e59; border-bottom-width: 3px;
        border-radius: 5px; background: #1b1d22; font: inherit; }
  .row { display: flex; gap: 12px; margin-bottom: 6px; opacity: .8; }
  .row b { min-width: 72px; font-weight: 400; color: #fff; }
  #log { opacity: .6; white-space: pre-line; }
  .hint { opacity: .5; margin-top: 16px; }
</style>
<script src="works.js"></script>

<script>window.WORKS = WORKS.filter((w) => window.REVIEW?.[w.no]?.status !== 'delete');</script>
</head>
<body>
<aside>
  <h1>WORKS</h1>
  <div id="list"></div>
  <p class="hint"><a href="index.html">← ギャラリー</a></p>
</aside>
<main><iframe id="view"></iframe></main>
<section>
  <h1 id="title"></h1>
  <h2>この作品のキー</h2>
  <div id="own"></div>
  <h2>共通キー</h2>
  <div id="common"></div>
  <h2>マウス</h2>
  <div id="mouse"></div>
  <h2>ログ</h2>
  <div id="log"></div>
  <p class="hint">ボタンを押すか、このページ上でそのままキーを押すと作品に送られます。</p>
</section>
<script>
  const view = document.getElementById('view');
  let current = null, logLines = [];
  const log = (t) => { logLines = [t, ...logLines].slice(0, 8); document.getElementById('log').textContent = logLines.join('\n'); };

  const keyButton = (k) => `<button class="key" data-key="${k.key === ' ' ? 'space' : k.key}"><kbd>${k.label}</kbd><span>${k.desc}</span></button>`;

  function select(w) {
    current = w;
    view.src = `${w.dir}/index.html`;
    document.getElementById('title').textContent = `${w.no} · ${w.title.toUpperCase()}`;
    document.getElementById('own').innerHTML = w.keys.length ? w.keys.map(keyButton).join('') : '<p style="opacity:.5">なし</p>';
    document.getElementById('common').innerHTML = COMMON_KEYS.map(keyButton).join('');
    document.querySelectorAll('.work').forEach((b) => b.classList.toggle('on', b.dataset.no === w.no));
    history.replaceState(null, '', `?w=${w.no}`);
    log(`${w.no} を開きました`);
  }

  function send(key) {
    if (!current) return;
    const all = [...current.keys, ...COMMON_KEYS];
    const k = all.find((x) => x.key === key);
    if (!k) return;
    const win = view.contentWindow;
    win.dispatchEvent(new win.KeyboardEvent('keydown', { key }));
    const btn = document.querySelector(`.key[data-key="${key === ' ' ? 'space' : key}"]`);
    if (btn) { btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 250); }
    log(`[${k.label}] ${k.desc}`);
  }

  document.getElementById('list').innerHTML = WORKS.map((w) =>
    `<button class="work" data-no="${w.no}">${w.no} ${w.title}<span class="tag ${w.motion}">${w.motion}</span></button>`).join('');
  document.getElementById('mouse').innerHTML = MOUSE.map(([a, b]) => `<div class="row"><b>${a}</b>${b}</div>`).join('');

  document.addEventListener('click', (e) => {
    const w = e.target.closest('.work'); if (w) select(WORKS.find((x) => x.no === w.dataset.no));
    const k = e.target.closest('.key'); if (k) send(k.dataset.key === 'space' ? ' ' : k.dataset.key);
    document.activeElement?.blur();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') e.preventDefault();
    send(e.key.toLowerCase() === e.key ? e.key : e.key.toLowerCase());
  });

  const want = new URLSearchParams(location.search).get('w');
  select(WORKS.find((w) => w.no === want) ?? WORKS[WORKS.length - 1]);
</script>
</body>
</html>
