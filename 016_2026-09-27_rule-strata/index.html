<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Rule Strata</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.45); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

// 地層ごとに規則が変わる：同じ生命が、時代ごとに違う質感の層を残す
const RULES = [
  ['Conway',    [3],          [2, 3]],
  ['HighLife',  [3, 6],       [2, 3]],
  ['Move',      [3, 6, 8],    [2, 4, 5]],
  ['Day&Night', [3, 6, 7, 8], [3, 4, 6, 7, 8]],
  ['Amoeba',    [3, 5, 7],    [1, 3, 5, 8]],
  ['Anneal',    [4, 6, 7, 8], [3, 5, 6, 7, 8]],
  ['2x2',       [3, 6],       [1, 2, 5]],
];
const PALETTES = [
  { name: '藍と朱', bg: '#0b1020', c: ['#1d3557', '#e63946', '#f6efe4'] },
  { name: '墨と金', bg: '#0a0a0a', c: ['#2a2622', '#b08d57', '#f4e9d8'] },
  { name: '苔庭',   bg: '#0c1611', c: ['#23433a', '#8fb996', '#f0ead2'] },
  { name: '夜桜',   bg: '#100b18', c: ['#3a2e5c', '#d77fa1', '#fbe7e9'] },
];
const pal = pick(PALETTES);

const N = 84, G = 176, H = 0.42, R0 = N * 0.47;
const epochs = [];
{
  const n = 3 + Math.floor(rand() * 2);
  let pool = RULES.slice(), g = 0;
  for (let i = 0; i < n; i++) {
    const r = pool.splice(Math.floor(rand() * pool.length), 1)[0];
    const len = i === n - 1 ? G - g : Math.floor(G / n * (0.7 + rand() * 0.6));
    epochs.push({ name: r[0], b: r[1], s: r[2], from: g, to: g + len });
    g += len;
  }
}
const epochAt = (g) => epochs.find((e) => g < e.to) ?? epochs[epochs.length - 1];

let grid = new Uint8Array(N * N);
function sow(cx, cy, r, dens) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const d = Math.hypot(x - cx, y - cy);
    if (d < r && rand() < dens * (1 - d / r * 0.5)) grid[y * N + x] = 1;
  }
}
sow(N / 2, N / 2, N * (0.2 + rand() * 0.12), 0.3 + rand() * 0.15);
const layers = [];
for (let g = 0; g < G; g++) {
  layers.push(grid);
  const e = epochAt(g + 1);
  const next = new Uint8Array(N * N);
  let pop = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (Math.hypot(x - N / 2 + 0.5, y - N / 2 + 0.5) > R0) continue;
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++)
      if (dx || dy) n += grid[((y + dy + N) % N) * N + (x + dx + N) % N];
    const v = grid[y * N + x] ? +e.s.includes(n) : +e.b.includes(n);
    next[y * N + x] = v; pop += v;
  }
  grid = next;
  if (pop < 30) sow(N * (0.35 + rand() * 0.3), N * (0.35 + rand() * 0.3), 8 + rand() * 8, 0.4);
}

// --- three.js ---
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 100, 210);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 500);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(35) / 2) / Math.pow(camera.aspect, 0.6))) : 35; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(112, G * H * 0.82, 112);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, G * H * 0.46, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.4);
sun.position.set(60, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, far: 320 });
scene.add(sun);

let count = 0;
for (const L of layers) for (const v of L) count += v;
const mesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.92, H, 0.92),
  new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.05 }),
  count);
mesh.castShadow = mesh.receiveShadow = true;

// 時代ごとに3色のうち隣り合う2色を行き来し、時代の境目には細い明るい帯
const cs = pal.c.map((h) => new THREE.Color(h));
const m = new THREE.Matrix4(), col = new THREE.Color();
let i = 0;
layers.forEach((L, g) => {
  const e = epochAt(g), ei = epochs.indexOf(e), t = (g - e.from) / Math.max(1, e.to - e.from - 1);
  const a = cs[ei % 3], b = cs[(ei + 1) % 3];
  col.lerpColors(a, b, ei % 2 ? 1 - t * 0.7 : t * 0.7 + 0.15);
  const seam = g - e.from < 2 && ei > 0;
  for (let k = 0; k < N * N; k++) if (L[k]) {
    const born = g > 0 && !layers[g - 1][k];
    m.makeTranslation(k % N - N / 2, g * H, Math.floor(k / N) - N / 2);
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, seam ? cs[2] : born ? col.clone().offsetHSL(0, 0, 0.07) : col);
    i++;
  }
});
mesh.count = 0;
scene.add(mesh);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -H / 2;
ground.receiveShadow = true;
scene.add(ground);

document.getElementById('info').textContent = `016 · RULE STRATA · ${epochs.map((e) => e.name).join(' → ')} · ${pal.name} · seed ${seed}`;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 's') {
    const a = document.createElement('a');
    a.download = `016_rule-strata_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click();
  }
});

const t0 = performance.now();
renderer.setAnimationLoop(() => {
  const p = Math.min(1, (performance.now() - t0) / 7000);
  mesh.count = Math.floor(count * (1 - Math.pow(1 - p, 3)));
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
