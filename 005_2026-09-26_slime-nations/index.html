<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>005 — Slime Nations</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; display: grid; place-items: center; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
</head>
<body>
<div id="info"></div>
<script>
// 多種族 Physarum（粘菌）：各種族は自分の痕跡に寄り、他種族の痕跡を避ける
const q = new URLSearchParams(location.search);
const SEED = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
const W = 420, H = 420, AGENTS = 26000;
const PALETTES = [
  { name: 'Neon',     bg: [6, 4, 12],   c: ['#ff2fb3', '#00e5ff', '#ffe14d'] },
  { name: 'Spectrum', bg: [4, 4, 8],    c: ['#ff3b30', '#34c759', '#5e5ce6', '#ffcc00'] },
  { name: '浮世絵',   bg: [240, 233, 218], c: ['#1d3557', '#e63946', '#2a9d8f'], ink: true },
  { name: 'Aurora',   bg: [3, 6, 10],   c: ['#6ff7d2', '#b388ff'] },
];
let pal, NS, trails, ax, ay, ah, sp, params, paused = false, eventText = '', eventAt = -1e9, nextEvent = 0;

const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function randomParams() {
  return { sa: random(0.25, 1.1), sd: random(5, 22), ra: random(0.2, 0.7), v: random(0.8, 1.7) };
}

function setup() {
  randomSeed(SEED);
  const c = createCanvas(W, H);
  pixelDensity(1);
  fit(c);
  pal = random(PALETTES);
  pal.rgb = pal.c.map(hex);
  NS = pal.c.length;
  trails = Array.from({ length: NS }, () => new Float32Array(W * H));
  ax = new Float32Array(AGENTS); ay = new Float32Array(AGENTS); ah = new Float32Array(AGENTS); sp = new Uint8Array(AGENTS);
  params = Array.from({ length: NS }, randomParams);
  for (let i = 0; i < AGENTS; i++) {
    sp[i] = i % NS;
    const a = random(TWO_PI), r = random(40, 170), off = (sp[i] / NS) * TWO_PI;
    ax[i] = W / 2 + Math.cos(a + off) * r * 0.5 + Math.cos(off) * 60;
    ay[i] = H / 2 + Math.sin(a + off) * r * 0.5 + Math.sin(off) * 60;
    ah[i] = random(TWO_PI);
  }
  nextEvent = millis() + random(12000, 22000);
}

function fit(c) {
  const s = Math.min(innerWidth, innerHeight);
  c.elt.style.width = s + 'px'; c.elt.style.height = s + 'px';
}
function windowResized() { fit({ elt: document.querySelector('canvas') }); }

function sense(i, ang) {
  const p = params[sp[i]], a = ah[i] + ang;
  const x = ((Math.floor(ax[i] + Math.cos(a) * p.sd) % W) + W) % W;
  const y = ((Math.floor(ay[i] + Math.sin(a) * p.sd) % H) + H) % H;
  const k = y * W + x;
  let v = 0;
  for (let s = 0; s < NS; s++) v += s === sp[i] ? trails[s][k] : -0.8 * trails[s][k];
  return v;
}

function stepAgents() {
  for (let i = 0; i < AGENTS; i++) {
    const p = params[sp[i]];
    const f = sense(i, 0), l = sense(i, p.sa), r = sense(i, -p.sa);
    if (f < l && f < r) ah[i] += (random() < 0.5 ? 1 : -1) * p.ra;
    else if (l > r) ah[i] += p.ra;
    else if (r > l) ah[i] -= p.ra;
    ax[i] = (ax[i] + Math.cos(ah[i]) * p.v + W) % W;
    ay[i] = (ay[i] + Math.sin(ah[i]) * p.v + H) % H;
    trails[sp[i]][(ay[i] | 0) * W + (ax[i] | 0)] += 1.2;
  }
}

const tmp = new Float32Array(W * H);
function diffuse() {
  for (const T of trails) {
    for (let y = 0; y < H; y++) {
      const ym = ((y - 1 + H) % H) * W, y0 = y * W, yp = ((y + 1) % H) * W;
      for (let x = 0; x < W; x++) {
        const xm = (x - 1 + W) % W, xp = (x + 1) % W;
        tmp[y0 + x] = (T[ym + xm] + T[ym + x] + T[ym + xp] + T[y0 + xm] + T[y0 + x] + T[y0 + xp]
                     + T[yp + xm] + T[yp + x] + T[yp + xp]) / 9 * 0.93;
      }
    }
    T.set(tmp);
  }
}

const EVENTS = {
  mutate() { const s = floor(random(NS)); params[s] = randomParams(); return `MUTATION · species ${s + 1}`; },
  migrate() {
    const s = floor(random(NS)), cx = random(W), cy = random(H);
    for (let i = 0; i < AGENTS; i++) if (sp[i] === s) {
      const a = random(TWO_PI), r = random(10, 50); ax[i] = (cx + Math.cos(a) * r + W) % W; ay[i] = (cy + Math.sin(a) * r + H) % H; ah[i] = a;
    }
    return `MIGRATION · species ${s + 1}`;
  },
  convert() {
    const a = floor(random(NS)), b = (a + 1) % NS;
    for (let i = 0; i < AGENTS; i++) if (sp[i] === a && random() < 0.5) sp[i] = b;
    return `CONQUEST · ${a + 1} → ${b + 1}`;
  },
};
function fire(name) {
  const keys = Object.keys(EVENTS);
  eventText = EVENTS[name ?? random(keys)]();
  eventAt = millis();
  const counts = new Array(NS).fill(0); for (let i = 0; i < AGENTS; i++) counts[sp[i]]++;
  counts.forEach((c, s) => { if (c < AGENTS / NS * 0.3) for (let i = 0; i < AGENTS; i++) if (random() < 0.15) sp[i] = s; });
}

function draw() {
  if (!paused) {
    stepAgents(); diffuse();
    if (millis() > nextEvent) { fire(); nextEvent = millis() + random(12000, 26000); }
  }
  loadPixels();
  const [br, bg, bb] = pal.bg;
  for (let k = 0; k < W * H; k++) {
    let r = br, g = bg, b = bb;
    for (let s = 0; s < NS; s++) {
      const t = Math.min(1, trails[s][k] * 0.18), c = pal.rgb[s];
      if (pal.ink) { r -= (255 - c[0]) * t; g -= (255 - c[1]) * t; b -= (255 - c[2]) * t; }
      else { r += c[0] * t; g += c[1] * t; b += c[2] * t; }
    }
    const j = k * 4;
    pixels[j] = r; pixels[j + 1] = g; pixels[j + 2] = b; pixels[j + 3] = 255;
  }
  updatePixels();
  const flash = millis() - eventAt < 4000 ? `\n${eventText}` : '';
  document.getElementById('info').textContent = `005 · SLIME NATIONS · ${NS} species · ${pal.name} · seed ${SEED}${flash}`;
}

function keyPressed() {
  if (key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (key === 'e') fire();
  if (key === ' ') paused = !paused;
  if (key === 's') saveCanvas(`005_slime-nations_${SEED}`, 'png');
}
</script>
</body>
</html>
