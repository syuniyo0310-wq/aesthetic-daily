<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Fine Gale</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALS = [
  { name: 'Reef', bg: '#05080c', c: ['#9be7ff', '#f2f6f8', '#ffd27a', '#ff7aa2'] },
  { name: 'Ink', bg: '#08070c', c: ['#f4efe6', '#e2b15c', '#8eb6ff'] },
  { name: 'Moss', bg: '#060806', c: ['#d6ffb0', '#f2f2ea', '#7dcea0'] },
];
const pal = pick(PALS);
const col = pal.c.map((h) => new THREE.Color(h));
const MODES = ['LACE', 'NEEDLE', 'TILE'];
let mode = 0;
const RULES = [
  { name: 'B3/S23', b: [3], s: [2, 3] },
  { name: 'B36/S125', b: [3, 6], s: [1, 2, 5] },
  { name: 'B3/S12', b: [3], s: [1, 2] },
];
let rule = pick(RULES);
const N = 120, KEEP = 22, MAX = 11000, PITCH = 0.105;
let grid = new Uint8Array(N * N), next = new Uint8Array(N * N);
const at = (x, y) => grid[((y + N) % N) * N + ((x + N) % N)];
function life() {
  const born = new Set(rule.b), stay = new Set(rule.s);
  next.fill(0);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) c += at(x + dx, y + dy);
    const me = at(x, y);
    next[y * N + x] = (me ? stay.has(c) : born.has(c)) ? 1 : 0;
  }
  const t = grid; grid = next; next = t;
}
function populate() {
  grid.fill(0);
  for (let y = 36; y < 84; y++) for (let x = 36; x < 84; x++) if (rand() < 0.28) grid[y * N + x] = 1;
}
populate();
for (let i = 0; i < 18; i++) life();

const layers = [];
let wx = 0, wz = 0, gust = 0;
function snap() {
  wx += (rand() - 0.5) * 0.08 + Math.sin(layers.length * 0.3) * 0.02;
  wz += (rand() - 0.5) * 0.08;
  if (gust > 0) { wx += 0.35; gust--; }
  wx = Math.max(-0.55, Math.min(0.55, wx)); wz = Math.max(-0.55, Math.min(0.55, wz));
  const cells = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!grid[y * N + x]) continue;
    let nb = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if ((dx || dy) && at(x + dx, y + dy)) nb++;
    cells.push((x & 255) | ((y & 255) << 8) | ((nb & 15) << 16));
  }
  const prev = layers.at(-1);
  if (cells.length < 30) populate();
  layers.push({ cells, ox: (prev?.ox ?? 0) + wx, oz: (prev?.oz ?? 0) + wz, mode });
  if (layers.length > KEEP) layers.shift();
}
for (let i = 0; i < 8; i++) life();
for (let i = 0; i < KEEP; i++) { life(); snap(); }

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(pal.bg); scene.fog = new THREE.FogExp2(pal.bg, 0.02);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(40) / 2) / Math.pow(camera.aspect, 0.6))) : 40; camera.updateProjectionMatrix(); };
fitFov(); camera.position.set(9, 7, 16);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
window.__view = { get() { const p = camera.position, g = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+g.x.toFixed(3), ty:+g.y.toFixed(3), tz:+g.z.toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [a, b, d, tx, ty, tz] = c.split(',').map(Number); if ([a, b, d].every(Number.isFinite)) window.__view.set({ x: a, y: b, z: d, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dir = new THREE.DirectionalLight(0xffffff, 0.75); dir.position.set(10, 18, 8); scene.add(dir);

const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.48, metalness: 0.12 }), MAX);
mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX * 3), 3);
mesh.frustumCulled = false; scene.add(mesh);
const dummy = new THREE.Object3D(), aim = new THREE.Vector3();
function draw() {
  let n = 0, ax = 0, ay = 0, az = 0, an = 0;
  const stride = Math.max(1, Math.ceil(layers.reduce((s, L) => s + L.cells.length, 0) / MAX));
  for (let li = 0; li < layers.length; li++) {
    const L = layers[li];
    for (let k = 0; k < L.cells.length && n < MAX; k += stride) {
      const p = L.cells[k], x = p & 255, y = (p >> 8) & 255, nb = (p >> 16) & 15;
      const X = (x - N / 2) * PITCH + L.ox, Z = (y - N / 2) * PITCH + L.oz, Y = li * 0.42;
      dummy.position.set(X, Y, Z); dummy.rotation.set(0, 0, 0);
      if (L.mode === 1) dummy.scale.set(0.045, 0.7, 0.045);
      else if (L.mode === 2) dummy.scale.set(0.16, 0.045, 0.16);
      else dummy.scale.set(0.07, nb > 3 ? 0.22 : 0.08, 0.07);
      dummy.updateMatrix(); mesh.setMatrixAt(n, dummy.matrix);
      mesh.setColorAt(n, col[(nb + L.mode) % col.length]); n++;
      if ((k & 15) === 0) { ax += X; ay += Y; az += Z; an++; }
    }
  }
  mesh.count = Math.max(1, n);
  mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true;
  if (an) aim.set(ax / an, ay / an, az / an);
  controls.target.lerp(aim, 0.06);
}
draw();

let acc = 0, paused = false, evAt = -1e9, when = performance.now() + 7000;
function event() {
  mode = (mode + 1) % MODES.length;
  if (rand() < 0.5) rule = pick(RULES);
  if (rand() < 0.7) gust = 6;
  evAt = performance.now(); when = evAt + 6200 + rand() * 2000;
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') event();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `031_fine-gale_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
const hud = document.getElementById('info');
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) {
    if (now > when) event();
    acc += dt * 5; while (acc >= 1) { life(); snap(); acc--; }
    draw();
  }
  controls.update(); renderer.render(scene, camera);
  hud.textContent = `031 · FINE GALE · ${MODES[mode]} · ${rule.name} · ${pal.name} · seed ${seed}${now - evAt < 1600 ? '\n' + MODES[mode] : ''}`;
});
</script></body></html>
