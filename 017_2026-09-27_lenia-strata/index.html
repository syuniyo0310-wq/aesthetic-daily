<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Lenia Strata</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALETTES = [
  { name: 'Neon',     bg: '#06040c', c: ['#ff2fb3', '#00e5ff', '#7dff3a', '#ffe14d'] },
  { name: 'Coral',    bg: '#0a0608', c: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff'] },
  { name: '深海',     bg: '#03060c', c: ['#13a8a8', '#9ef0d6', '#3a86ff', '#f7f3e3'] },
  { name: '墨と金',   bg: '#0a0908', c: ['#3a332c', '#b08d57', '#f4e9d8', '#8c2f39'] },
];
const pal = pick(PALETTES);
const stops = pal.c.map((h) => new THREE.Color(h));
const colorAt = (h, out) => {
  const f = (((h % 1) + 1) % 1) * stops.length, i = Math.floor(f);
  return out.lerpColors(stops[i], stops[(i + 1) % stops.length], f - i);
};

// --- Lenia：連続値のセルが、リング状の核で近傍を感じて滑らかな生き物になる ---
const N = 96, R = 10, K = 84, H = 0.5;
let mu = 0.15, sigma = 0.015;
const DT = 0.1;
const kern = [];
{
  let sum = 0;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const r = Math.hypot(dx, dy) / R;
    if (r >= 1 || r === 0) continue;
    const w = Math.exp(4 - 1 / (r * (1 - r)));
    kern.push(dx, dy, w); sum += w;
  }
  for (let i = 2; i < kern.length; i += 3) kern[i] /= sum;
}
const P = N + 2 * R;
const koff = [], kw = [];
for (let i = 0; i < kern.length; i += 3) { koff.push(kern[i + 1] * P + kern[i]); kw.push(kern[i + 2]); }
let A = new Float32Array(N * N);
const pad = new Float32Array(P * P);
// 色相は値の重みで近傍から運ばれる：分裂した生き物は親の色を継ぐ
let hx = new Float32Array(N * N), hy = new Float32Array(N * N);

function soup(cx, cy, size, h = rand()) {
  for (let y = -size; y <= size; y++) for (let x = -size; x <= size; x++) {
    if (Math.hypot(x, y) > size) continue;
    const k = ((cy + y + N) % N) * N + (cx + x + N) % N;
    A[k] = rand(); hx[k] = Math.cos(h * Math.PI * 2); hy[k] = Math.sin(h * Math.PI * 2);
  }
}
function seedWorld() {
  A.fill(0);
  const n = 9 + Math.floor(rand() * 4);
  for (let i = 0; i < n; i++) soup(Math.floor(rand() * N), Math.floor(rand() * N), Math.floor(R * 0.9), i / n);
}
function carryHue() {
  const nx = new Float32Array(N * N), ny = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let sx = 0, sy = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const k = ((y + dy + N) % N) * N + (x + dx + N) % N, w = A[k];
      sx += hx[k] * w; sy += hy[k] * w;
    }
    const k = y * N + x, l = Math.hypot(sx, sy);
    if (l > 1e-4) { nx[k] = sx / l; ny[k] = sy / l; } else { nx[k] = hx[k]; ny[k] = hy[k]; }
  }
  hx = nx; hy = ny;
}
function step() {
  for (let y = 0; y < P; y++) {
    const sy = ((y - R) % N + N) % N;
    for (let x = 0; x < P; x++) pad[y * P + x] = A[sy * N + ((x - R) % N + N) % N];
  }
  const na = new Float32Array(N * N);
  const L = kw.length, s2 = 2 * sigma * sigma;
  let mass = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = (y + R) * P + x + R;
    let u = 0;
    for (let i = 0; i < L; i++) u += pad[c + koff[i]] * kw[i];
    const g = 2 * Math.exp(-((u - mu) ** 2) / s2) - 1;
    const v = Math.min(1, Math.max(0, A[y * N + x] + DT * g));
    na[y * N + x] = v; mass += v;
  }
  A = na;
  return mass;
}

// 生き物＝値のある連結領域
function creatures() {
  const seen = new Uint8Array(N * N), out = [];
  for (let k0 = 0; k0 < N * N; k0++) {
    if (A[k0] < 0.02 || seen[k0]) continue;
    const cells = [k0], st = [k0]; seen[k0] = 1;
    while (st.length) {
      const j = st.pop(), x = j % N, y = (j / N) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const k = ((y + dy + N) % N) * N + (x + dx + N) % N;
        if (!seen[k] && A[k] >= 0.02) { seen[k] = 1; st.push(k); cells.push(k); }
      }
    }
    out.push(cells);
  }
  return out;
}
// 生き残る種が出るまで、画面の外でスープを煮る
function rebirth() {
  mu = 0.15; sigma = 0.015;
  for (let t = 0; t < 6; t++) {
    seedWorld();
    let m = 0;
    for (let i = 0; i < 60; i++) { m = step(); carryHue(); }
    if (m > 30) return;
  }
}
const EVENTS = {
  spawn() {
    const cs = creatures().filter((c) => c.length > 40);
    if (!cs.length) { rebirth(); return 'SPAWN'; }
    const src = pick(cs), ox = Math.floor(rand() * N), oy = Math.floor(rand() * N), dh = 0.2 + rand() * 0.6;
    const a = Math.cos(dh * Math.PI * 2), b = Math.sin(dh * Math.PI * 2);
    for (const k of src) {
      const t = ((Math.floor(k / N) + oy) % N) * N + (k % N + ox) % N;
      A[t] = A[k]; hx[t] = hx[k] * a - hy[k] * b; hy[t] = hx[k] * b + hy[k] * a;
    }
    return 'TWIN';
  },
  drift() { sigma = pick([0.015, 0.0155, 0.016].filter((v) => v !== sigma)); return sigma > 0.015 ? 'MITOSIS' : 'GLIDE'; },
  cut() {
    const a = rand() * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a), o = (rand() - 0.5) * N * 0.3;
    for (let k = 0; k < N * N; k++) if (Math.abs((k % N - N / 2) * c + (Math.floor(k / N) - N / 2) * sn - o) < 2) A[k] = 0;
    return 'CUT';
  },
};
// 分裂して増えすぎると結晶のように固まるので、生き物を丸ごと半分ほど消す
function cull() {
  for (const c of creatures()) if (rand() < 0.55) for (const k of c) A[k] = 0;
  eventText = 'CULL'; lastEventStep = gen;
}
let eventText = '';
function fireEvent(name) { eventText = EVENTS[name ?? pick(['spawn', 'spawn', 'drift', 'drift', 'cut'])](); lastEventStep = gen; }

// --- three.js ---
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 85, 180);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 500);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(38) / 2) / Math.pow(camera.aspect, 0.6))) : 38; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(100, 30, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -19, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(40, 80, 30);
scene.add(sun);

const geo = new THREE.BoxGeometry(0.9, H, 0.9);
const tower = new THREE.Group();
scene.add(tower);
const layers = [];
for (let i = 0; i < K; i++) {
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.45, metalness: 0.1 }), N * N);
  mesh.setColorAt(0, new THREE.Color());
  mesh.count = 0;
  mesh.userData.born = -1;
  tower.add(mesh);
  layers.push(mesh);
}
const m4 = new THREE.Matrix4(), col = new THREE.Color();
const TH = 0.3;
let gen = 0, lastEventStep = 0, nextEventIn = 70;
function pushLayer() {
  const mesh = layers[gen % K];
  let c = 0;
  for (let k = 0; k < N * N; k++) {
    const v = A[k];
    if (v < TH) continue;
    m4.makeTranslation(k % N - N / 2, 0, Math.floor(k / N) - N / 2);
    mesh.setMatrixAt(c, m4);
    colorAt(Math.atan2(hy[k], hx[k]) / (Math.PI * 2), col).multiplyScalar(0.7 + 0.4 * v);
    mesh.setColorAt(c, col);
    c++;
  }
  mesh.count = c;
  mesh.instanceMatrix.needsUpdate = true;
  mesh.instanceColor.needsUpdate = true;
  mesh.userData.born = gen;
  return c;
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.35, 0.92));
composer.addPass(new OutputPass());

rebirth();
let mass = 0, pop = pushLayer();

const info = document.getElementById('info');
let paused = false;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') fireEvent();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') {
    const a = document.createElement('a');
    a.download = `017_lenia-strata_${seed}_${gen}.png`; a.href = renderer.domElement.toDataURL(); a.click();
  }
});

const STEP_MS = 80, SUB = 1;
let acc = 0, last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(100, now - last); last = now;
  if (!paused) acc += dt;
  while (acc >= STEP_MS) {
    acc -= STEP_MS;
    for (let i = 0; i < SUB; i++) { mass = step(); carryHue(); }
    gen++;
    pop = pushLayer();
    if (mass < 20) { rebirth(); eventText = 'EXTINCTION → REBIRTH'; lastEventStep = gen; }
    else if (mass > 420) cull();
    else if (mass < 110 && gen - lastEventStep > 12) fireEvent('spawn');
    else if (gen - lastEventStep > nextEventIn) { fireEvent(); nextEventIn = 40 + Math.floor(rand() * 60); }
  }
  const frac = acc / STEP_MS;
  for (const mesh of layers) {
    if (mesh.userData.born < 0) continue;
    const age = gen - mesh.userData.born + frac;
    mesh.position.y = -age * H;
    const fade = Math.max(0, 1 - age / K);
    const hot = age < 1.5 ? 1.25 - age * 0.17 : 1;
    mesh.material.color.setScalar(Math.pow(fade, 1.3) * hot * 1.15);
    mesh.visible = age < K;
  }
  controls.update();
  composer.render();
  const flash = gen - lastEventStep < 25 ? `\n${eventText}` : '';
  info.textContent = `017 · LENIA STRATA · μ ${mu.toFixed(3)} σ ${sigma.toFixed(4)} · ${pal.name} · seed ${seed} · gen ${gen}${flash}`;
});
</script>
</body>
</html>
