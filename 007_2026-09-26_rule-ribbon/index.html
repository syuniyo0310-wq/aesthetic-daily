<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>007 — Rule Ribbon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALETTES = [
  { name: 'Neon',   bg: '#07060d', c: ['#0c0a1a', '#ff2fb3', '#00e5ff'] },
  { name: '浮世絵', bg: '#0b1020', c: ['#f1e9d8', '#1d3557', '#e63946'] },
  { name: 'Lime',   bg: '#07090b', c: ['#101418', '#7dff3a', '#ffe14d'] },
  { name: '墨と金', bg: '#0a0908', c: ['#efe7da', '#1a1a1a', '#b08d57'] },
];
const pal = pick(PALETTES);

// 3色トータリスティック 1D CA（中央1点スタート）。退屈な規則は棄却して選び直す
const W = 384, LEN = 2304;
function runCA(code) {
  const rows = new Uint8Array(W * LEN);
  rows[W >> 1] = 1;
  for (let y = 1; y < LEN; y++) for (let x = 0; x < W; x++) {
    const p = (y - 1) * W;
    rows[y * W + x] = code[rows[p + (x + W - 1) % W] + rows[p + x] + rows[p + (x + 1) % W]];
  }
  return rows;
}
function interesting(rows) {
  const tail = rows.subarray(W * (LEN - 200));
  let on = 0, change = 0;
  for (let i = W; i < tail.length; i++) { on += tail[i] > 0; change += tail[i] !== tail[i - W]; }
  const n = tail.length - W;
  return on / n > 0.15 && on / n < 0.85 && change / n > 0.08;
}
let code, rows;
for (let tries = 0; tries < 60; tries++) {
  code = [0, ...Array.from({ length: 6 }, () => Math.floor(rand() * 3))];
  rows = runCA(code);
  if (interesting(rows)) break;
}
const ruleNo = code.reduce((a, d, i) => a + d * 3 ** i, 0);

const canvas = document.createElement('canvas');
canvas.width = LEN; canvas.height = W;
const ctx = canvas.getContext('2d'), img = ctx.createImageData(LEN, W);
const rgb = pal.c.map((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)));
for (let y = 0; y < LEN; y++) for (let x = 0; x < W; x++) {
  const c = rgb[rows[y * W + x]], o = (x * LEN + y) * 4;
  img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
}
ctx.putImageData(img, 0, 0);
const tex = new THREE.CanvasTexture(canvas);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;

// リボンの形（u: 時間方向, v: 幅方向）
const FORMS = {
  MOBIUS(u, v, out) {
    const a = u * Math.PI * 2, w = (v - 0.5) * 16, r = 26 + w * Math.cos(a / 2);
    out.set(r * Math.cos(a), w * Math.sin(a / 2), r * Math.sin(a));
  },
  SCROLL(u, v, out) {
    const a = u * Math.PI * 7, r = 6 + u * 26;
    out.set(r * Math.cos(a), (v - 0.5) * 22, r * Math.sin(a));
  },
  WAVE(u, v, out) {
    const x = (u - 0.5) * 120, a = u * Math.PI * 5;
    out.set(x, Math.sin(a) * 12 + (v - 0.5) * 18 * Math.cos(a * 0.5), Math.cos(a * 0.8) * 16 + (v - 0.5) * 8);
  },
  KNOT(u, v, out) {
    const a = u * Math.PI * 2, p = 2, qn = 3, r = 16 + 7 * Math.cos(qn * a);
    const w = (v - 0.5) * 7;
    out.set(r * Math.cos(p * a), 7 * Math.sin(qn * a) * 2 + w, r * Math.sin(p * a));
    out.addScaledVector(out.clone().setY(0).normalize(), w * 0.8);
  },
};
const formName = pick(Object.keys(FORMS));

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 600);
// ?????????????????????
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(36) / 2) / Math.pow(camera.aspect, 0.6))) : 36; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(0, 30, 76);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(40, 60, 50);
scene.add(key);

const ribbon = new THREE.Mesh(
  new ParametricGeometry(FORMS[formName], 900, 24),
  new THREE.MeshPhysicalMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.55, sheen: 1, sheenRoughness: 0.4,
                                   sheenColor: new THREE.Color(pal.c[2]) }));
scene.add(ribbon);

document.getElementById('info').textContent =
  `007 · RULE RIBBON · 3-color totalistic #${ruleNo} · ${formName} · ${pal.name} · seed ${seed}`;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 's') {
    const a = document.createElement('a');
    a.download = `007_rule-ribbon_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click();
  }
});

renderer.setAnimationLoop((now) => {
  controls.autoRotateSpeed = Math.sin(now * 0.00012) * 1.4;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
