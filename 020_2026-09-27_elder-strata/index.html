<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Elder Strata</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const RULES = [
  { name: 'Conway B3/S23',        b: [3],          s: [2, 3] },
  { name: 'HighLife B36/S23',     b: [3, 6],       s: [2, 3] },
  { name: 'Move B368/S245',       b: [3, 6, 8],    s: [2, 4, 5] },
  { name: 'Coral B3/S45678',      b: [3],          s: [4, 5, 6, 7, 8] },
  { name: 'Anneal B4678/S35678',  b: [4, 6, 7, 8], s: [3, 5, 6, 7, 8] },
];
const PALETTES = [
  { name: 'Neon',     bg: '#06040c', c: ['#ff2fb3', '#00e5ff', '#7dff3a', '#ffe14d'] },
  { name: 'Coral',    bg: '#0a0608', c: ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff'] },
  { name: '浮世絵',   bg: '#0b1020', c: ['#1d3557', '#e63946', '#f1faee', '#e9c46a'] },
  { name: 'Spectrum', bg: '#05050a', c: ['#ff3b30', '#ffcc00', '#34c759', '#00c7ff', '#5e5ce6', '#ff2d92'] },
];
const pal = pick(PALETTES);
const stops = pal.c.map((h) => new THREE.Color(h));
const colorAt = (h, out) => {
  const f = (((h % 1) + 1) % 1) * stops.length, i = Math.floor(f);
  return out.lerpColors(stops[i], stops[(i + 1) % stops.length], f - i);
};

// --- 多種族 Life。セルは生きた年数を覚える ---
const N = 80, K = 84, H = 0.55;
let alive = new Uint8Array(N * N), hue = new Float32Array(N * N), age = new Uint16Array(N * N);
// 種族（色相の帯）ごとに規則が違う：長老になって塊を作る種と、粒のまま流れる種が同じ舞台で争う
const SLOW = [RULES[3], RULES[4]], FAST = [RULES[0], RULES[1], RULES[2]];
let rules = [], rule = RULES[0];
const ruleFor = (h) => rules[Math.floor((((h % 1) + 1) % 1) * rules.length) % rules.length];
const TAU = Math.PI * 2;
const RIM = new Uint8Array(N * N).map((_, k) => +(Math.hypot(k % N - N / 2 + 0.5, Math.floor(k / N) - N / 2 + 0.5) > N * 0.47));

function blob(cx, cy, r, h, dens = 0.45) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++)
    if (!RIM[y * N + x] && Math.hypot(x - cx, y - cy) < r && rand() < dens) { const k = y * N + x; alive[k] = 1; hue[k] = h + (rand() - 0.5) * 0.04; age[k] = 0; }
}
function seedWorld() {
  alive.fill(0); age.fill(0);
  rules = [pick(SLOW), pick(FAST), pick(FAST)];
  rule = rules[0];
  const n = 3 + Math.floor(rand() * 3);
  for (let i = 0; i < n; i++) blob(N * (0.25 + rand() * 0.5), N * (0.25 + rand() * 0.5), 6 + rand() * 10, i / n);
}
function step() {
  const na = new Uint8Array(N * N), nh = new Float32Array(N * N), ng = new Uint16Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = y * N + x;
    if (RIM[k]) continue;
    let n = 0, sx = 0, sy = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const j = ((y + dy + N) % N) * N + (x + dx + N) % N;
      if (alive[j]) { n++; sx += Math.cos(hue[j] * TAU); sy += Math.sin(hue[j] * TAU); }
    }
    if (alive[k]) { if (ruleFor(hue[k]).s.includes(n)) { na[k] = 1; nh[k] = hue[k]; ng[k] = Math.min(999, age[k] + 1); } }
    else if (n) {
      const h = Math.atan2(sy, sx) / TAU;
      if (ruleFor(h).b.includes(n)) { na[k] = 1; nh[k] = h + (rand() < 0.03 ? (rand() - 0.5) * 0.3 : 0); }
    }
  }
  alive = na; hue = nh; age = ng;
}

const EVENTS = {
  mutate() { const i = Math.floor(rand() * rules.length); rules[i] = rule = pick(RULES.filter((r) => r !== rules[i])); return `MUTATION ${i} → ${rule.name}`; },
  bloom() { blob(rand() * N, rand() * N, 5 + rand() * 9, rand(), 0.5); return 'NEW SPECIES'; },
  // 若返り：古い塊を崩して粒に戻す
  youth() { for (let k = 0; k < N * N; k++) if (age[k] > 10 && rand() < 0.5) { alive[k] = 0; } return 'EROSION'; },
};
let eventText = '';
function fireEvent(name) { eventText = EVENTS[name ?? pick(Object.keys(EVENTS))](); lastEventStep = gen; }

// --- three.js ---
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 85, 180);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 500);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(38) / 2) / Math.pow(camera.aspect, 0.6))) : 38; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(84, 32, 84);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -16, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();

scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(40, 80, 30);
scene.add(sun);

// 年齢で3つの質感：若い＝小さな艶のある粒、壮年＝半艶の箱、長老＝太く低い金属の塊
const CLASSES = [
  { mat: { roughness: 0.15, metalness: 0.0 }, bright: 1.15 },
  { mat: { roughness: 0.55, metalness: 0.1 }, bright: 0.9 },
  { mat: { roughness: 0.3, metalness: 0.85 }, bright: 0.75 },
];
const classOf = (a) => (a < 2 ? 0 : a < 10 ? 1 : 2);
const sizeOf = (a) => (a < 2 ? 0.5 : a < 10 ? 0.7 + a * 0.025 : Math.min(2.2, 1.05 + (a - 10) * 0.04));
const geo = new THREE.BoxGeometry(1, H, 1);
const tower = new THREE.Group();
scene.add(tower);
const layers = [];
for (let i = 0; i < K; i++) {
  const set = CLASSES.map((c) => {
    const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial(c.mat), N * N);
    mesh.setColorAt(0, new THREE.Color());
    mesh.count = 0;
    tower.add(mesh);
    return mesh;
  });
  layers.push({ set, born: -1 });
}
const m4 = new THREE.Matrix4(), col = new THREE.Color();
let gen = 0, lastEventStep = 0, nextEventIn = 60;
function pushLayer() {
  const L = layers[gen % K], cnt = [0, 0, 0];
  let pop = 0;
  for (let k = 0; k < N * N; k++) if (alive[k]) {
    const a = age[k], ci = classOf(a), w = sizeOf(a), mesh = L.set[ci];
    m4.makeScale(w, 1, w).setPosition(k % N - N / 2, 0, Math.floor(k / N) - N / 2);
    mesh.setMatrixAt(cnt[ci], m4);
    colorAt(hue[k], col).multiplyScalar(CLASSES[ci].bright);
    mesh.setColorAt(cnt[ci], col);
    cnt[ci]++; pop++;
  }
  L.set.forEach((mesh, i) => { mesh.count = cnt[i]; mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true; });
  L.born = gen;
  return pop;
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.35, 0.93));
composer.addPass(new OutputPass());

seedWorld();
let pop = pushLayer();

const info = document.getElementById('info');
let paused = false;
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitFov();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') fireEvent();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') {
    const a = document.createElement('a');
    a.download = `020_elder-strata_${seed}_${gen}.png`; a.href = renderer.domElement.toDataURL(); a.click();
  }
});

const STEP_MS = 110;
let acc = 0, last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(100, now - last); last = now;
  if (!paused) acc += dt;
  while (acc >= STEP_MS) {
    acc -= STEP_MS;
    step(); gen++;
    pop = pushLayer();
    if (pop < N * N * 0.01) { seedWorld(); eventText = 'EXTINCTION → REBIRTH'; lastEventStep = gen; }
    else if (pop > N * N * 0.3) fireEvent(pick(['mutate', 'youth']));
    else if (gen - lastEventStep > nextEventIn) { fireEvent(); nextEventIn = 45 + Math.floor(rand() * 80); }
  }
  const frac = acc / STEP_MS;
  for (const L of layers) {
    if (L.born < 0) continue;
    const a = gen - L.born + frac;
    const fade = Math.max(0, 1 - a / K), hot = a < 1.5 ? 1.2 - a * 0.13 : 1;
    for (const mesh of L.set) {
      mesh.position.y = -a * H;
      mesh.material.color.setScalar(Math.pow(fade, 1.3) * hot * 1.1);
      mesh.visible = a < K;
    }
  }
  controls.update();
  composer.render();
  const flash = gen - lastEventStep < 25 ? `\n${eventText}` : '';
  info.textContent = `020 · ELDER STRATA · ${rules.map((r) => r.name.split(' ')[0]).join(' / ')} · ${pal.name} · seed ${seed} · gen ${gen}${flash}`;
});
</script>
</body>
</html>
