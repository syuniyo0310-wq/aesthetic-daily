<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contour Nations</title>
<style>html,body{margin:0;height:100%;background:#06070a;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:auto}
#hud{position:fixed;left:10px;bottom:8px;font:10px monospace;color:#6a6f78;letter-spacing:.05em}</style><style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body><canvas id="c"></canvas><div id="hud"></div>
<script>
const P = new URLSearchParams(location.search);
let SEED = parseInt(P.get('seed') || '7', 10);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const N = 240, SC = 3, W = N * SC;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = W;
const img = ctx.createImageData(W, W);
const RULES = [
  ['Conway', [3], [2,3]], ['HighLife', [3,6], [2,3]], ['Move', [3,6,8], [2,4,5]],
  ['Day&Night', [3,6,7,8], [3,4,6,7,8]], ['Coral', [3], [4,5,6,7,8]], ['Amoeba', [3,5,7], [1,3,5,8]],
];
const PALS = [
  ['SUMI-GOLD', [[20,18,16],[120,92,48],[214,176,96],[246,232,196]], [[216,170,80],[160,60,40],[230,220,200],[110,120,110]]],
  ['NEON', [[8,10,24],[40,40,90],[120,110,200],[230,226,255]], [[255,60,170],[40,230,255],[170,255,60],[255,190,40]]],
  ['UKIYO', [[14,22,36],[40,74,104],[196,170,130],[240,228,204]], [[214,72,52],[44,96,150],[232,196,96],[80,140,120]]],
  ['PASTEL', [[16,16,26],[90,84,120],[200,190,214],[250,244,240]], [[255,170,190],[150,210,255],[190,240,180],[255,220,150]]],
  ['CORAL', [[20,10,12],[110,40,50],[236,130,110],[255,226,206]], [[255,110,90],[255,190,120],[120,200,190],[200,90,160]]],
];
let rnd, rule, pal, NS, LV, STYLE, SYM, alive, nxt, sp, hgt, sm, acc, gen, nextEv, flood, evName, paused = false;
const R0 = N * 0.47, C = (N - 1) / 2;
const inDisk = new Uint8Array(N * N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) inDisk[y*N+x] = (x-C)**2 + (y-C)**2 < R0*R0 ? 1 : 0;
function mask(a){let m=0;for(const v of a)m|=1<<v;return m}
function setRule(i){rule={name:RULES[i][0],b:mask(RULES[i][1]),s:mask(RULES[i][2]),i}}
function blob(cx, cy, r, s, dens){
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const X = (cx + x) | 0, Y = (cy + y) | 0; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
    const k = Y*N+X; if (inDisk[k] && x*x+y*y <= r*r && rnd() < dens) { alive[k] = 1; sp[k] = s; }
  }
}
function init(){
  rnd = mulberry(SEED * 9973 + 17);
  pal = PALS[(rnd() * PALS.length) | 0];
  NS = 2 + ((rnd() * 3) | 0);
  LV = [5, 8, 12, 18][(rnd() * 4) | 0];
  STYLE = ['LINES', 'TERRACE', 'BOTH'][(rnd() * 3) | 0];
  SYM = rnd() < 0.3;
  setRule([0,0,1,2,3,4][(rnd() * 6) | 0]);
  alive = new Uint8Array(N*N); nxt = new Uint8Array(N*N); sp = new Uint8Array(N*N);
  hgt = new Float32Array(N*N); sm = new Float32Array(N*N); acc = new Float32Array(N*N*3);
  gen = 0; flood = 0; evName = 'genesis';
  for (let s = 0; s < NS; s++) {
    const a = rnd() * 6.283, d = rnd() * N * 0.22;
    blob(C + Math.cos(a)*d, C + Math.sin(a)*d, 24 + (rnd() * 26 | 0), s, 0.45);
  }
  if (SYM) kaleido();
  nextEv = 100 + (rnd() * 40 | 0);
  for (let i = 0; i < 700; i++) step();
  nextEv = gen + 200;
}
function kaleido(){
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const sx = x < N/2 ? x : N-1-x, sy = y < N/2 ? y : N-1-y;
    const a = Math.min(sx, sy), b = Math.max(sx, sy), k = y*N+x, src = b*N+a;
    alive[k] = alive[src] & inDisk[k]; sp[k] = sp[src];
  }
}
const cnt = new Uint8Array(4);
function step(){
  let pop = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = y*N+x; if (!inDisk[k]) { nxt[k] = 0; continue; }
    let n = 0; cnt.fill(0);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const X = x+dx, Y = y+dy; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
      const j = Y*N+X; if (alive[j]) { n++; cnt[sp[j]]++; }
    }
    if (alive[k]) nxt[k] = (rule.s >> n) & 1;
    else if ((rule.b >> n) & 1) {
      nxt[k] = 1; let best = 0; for (let s = 1; s < NS; s++) if (cnt[s] > cnt[best]) best = s; sp[k] = best;
    } else nxt[k] = 0;
    pop += nxt[k];
  }
  [alive, nxt] = [nxt, alive];
  const dec = flood > 0 ? 0.975 : 0.9965;
  for (let k = 0; k < N*N; k++) {
    hgt[k] = hgt[k] * dec + alive[k];
    if (alive[k]) { const c = pal[2][sp[k]]; acc[k*3] += (c[0]-acc[k*3])*0.08; acc[k*3+1] += (c[1]-acc[k*3+1])*0.08; acc[k*3+2] += (c[2]-acc[k*3+2])*0.08; }
  }
  if (flood > 0) flood--;
  gen++;
  const frac = pop / (Math.PI * R0 * R0);
  if (frac < 0.03) { for (let s = 0; s < NS; s++) blob(C + (rnd()-.5)*N*.5, C + (rnd()-.5)*N*.5, 16 + rnd()*16, s, 0.45); evName = 'extinction → rebirth'; }
  else if (frac > 0.42) { setRule(rnd() < 0.5 ? 0 : 1); evName = 'overgrowth → ' + rule.name; }
  if (gen >= nextEv) event();
}
function event(kind){
  const r = kind ?? (rnd() * 5 | 0);
  if (r === 0) { let i; do { i = rnd() * RULES.length | 0 } while (i === rule.i); setRule(i); evName = 'mutation → ' + rule.name; }
  else if (r === 1) { const a = rnd()*6.283, d = rnd()*N*0.3; blob(C+Math.cos(a)*d, C+Math.sin(a)*d, 10 + rnd()*16, rnd()*NS|0, 0.5); evName = 'invasion'; }
  else if (r === 2) { const rr = 20 + rnd()*N*0.3, s = rnd()*NS|0; for (let t = 0; t < 900; t++) { const a = t/900*6.283; blob(C+Math.cos(a)*rr, C+Math.sin(a)*rr, 1, s, 0.7); } evName = 'ring'; }
  else if (r === 3) { kaleido(); evName = 'kaleidoscope'; }
  else { flood = 110; evName = 'flood'; }
  nextEv = gen + 220 + (rnd() * 160 | 0);
}
function smooth(){
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let s = 0, w = 0;
    for (let dy = -2; dy <= 2; dy++) { const Y = y+dy; if (Y < 0 || Y >= N) continue;
      for (let dx = -2; dx <= 2; dx++) { const X = x+dx; if (X < 0 || X >= N) continue; s += hgt[Y*N+X]; w++; } }
    sm[y*N+x] = 1 - Math.exp(-s / w / 34);
  }
}
function samp(f, fx, fy){
  const x0 = Math.min(N-2, Math.max(0, fx|0)), y0 = Math.min(N-2, Math.max(0, fy|0)), tx = fx-x0, ty = fy-y0, k = y0*N+x0;
  return (f[k]*(1-tx)+f[k+1]*tx)*(1-ty) + (f[k+N]*(1-tx)+f[k+N+1]*tx)*ty;
}
function band(h){ return Math.floor(Math.min(1, h) * LV); }
function lerpPal(t){
  const g = pal[1], u = Math.min(0.999, Math.max(0, t)) * 3, i = u|0, f = u-i;
  return [g[i][0]+(g[i+1][0]-g[i][0])*f, g[i][1]+(g[i+1][1]-g[i][1])*f, g[i][2]+(g[i+1][2]-g[i][2])*f];
}
function render(){
  smooth();
  const d = img.data, inv = 1 / SC;
  for (let py = 0; py < W; py++) for (let px = 0; px < W; px++) {
    const fx = (px + .5) * inv - .5, fy = (py + .5) * inv - .5, o = (py*W+px)*4;
    const h = samp(sm, fx, fy);
    if (h < 0.035) { d[o]=6; d[o+1]=7; d[o+2]=10; d[o+3]=255; continue; }
    const b = band(h), hx = samp(sm, fx + inv, fy), hy = samp(sm, fx, fy + inv);
    const t = STYLE === 'LINES' ? Math.min(1, h) : (b + (STYLE === 'BOTH' ? 0.5 : 0.2)) / LV;
    const base = lerpPal(t * 0.8 + 0.08);
    const ci = (Math.min(N-1, Math.round(fy))*N + Math.min(N-1, Math.round(fx)))*3;
    const mix = 0.45 + 0.25 * h;
    let shade = 1 + (h - hx + h - hy) * 7;
    let line = 1;
    if (STYLE !== 'TERRACE' && (band(hx) !== b || band(hy) !== b)) line = b % 4 === 0 ? 0.35 : 0.62;
    const coast = Math.min(1, (h - 0.035) * 22);
    shade = Math.max(0.35, Math.min(1.5, shade)) * line * coast;
    d[o]   = (base[0]*(1-mix) + acc[ci]*mix) * shade;
    d[o+1] = (base[1]*(1-mix) + acc[ci+1]*mix) * shade;
    d[o+2] = (base[2]*(1-mix) + acc[ci+2]*mix) * shade;
    d[o+3] = 255;
  }
  for (let k = 0; k < N*N; k++) if (alive[k]) {
    const x = k % N, y = (k / N) | 0, c = pal[2][sp[k]], o = ((y*SC+1)*W + x*SC+1)*4;
    d[o] = Math.min(255, c[0]*0.5+d[o]*0.6+60); d[o+1] = Math.min(255, c[1]*0.5+d[o+1]*0.6+60); d[o+2] = Math.min(255, c[2]*0.5+d[o+2]*0.6+60);
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('hud').textContent = `041 · CONTOUR NATIONS · ${rule.name} · ${pal[0]} · ${STYLE} · seed ${SEED} · gen ${gen} · ${evName}`;
}
function fit(){ const s = Math.min(innerWidth, innerHeight) * 0.96; cv.style.width = s + 'px'; cv.style.height = s + 'px'; }
addEventListener('resize', fit);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'e') event();
  else if (k === ' ') { paused = !paused; e.preventDefault(); }
  else if (k === 'r') { SEED++; history.replaceState(null, '', '?seed=' + SEED); init(); }
  else if (k === 's') { const a = document.createElement('a'); a.download = `041_seed${SEED}.png`; a.href = cv.toDataURL(); a.click(); }
});
let f = 0;
function loop(){ requestAnimationFrame(loop); if (paused) return; f++; step(); render(); }
fit(); init(); render(); loop();
</script></body></html>
