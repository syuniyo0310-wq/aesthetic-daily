<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>014 — Salt Hive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.48); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const PALETTES = [
  { name: '塩', bg: '#090b10', c: ['#f4efe6', '#c9d6e3', '#8aa0b3'] },
  { name: '墨と金', bg: '#0a0908', c: ['#c4a46a', '#f3ead7', '#4a4036'] },
  { name: 'Neon', bg: '#07060c', c: ['#ff2fb3', '#00e5ff', '#ffe14d'] },
  { name: '浮世絵', bg: '#0b1020', c: ['#e63946', '#f1faee', '#e9c46a'] },
];
const pal = pick(PALETTES);
const cols = pal.c.map((h) => new THREE.Color(h));

const G = 29, R = 12.6, INNER = 2.8, WALL = 0.52;
const sites = [];
const nSites = 20 + Math.floor(rand() * 8);
for (let i = 0; i < nSites; i++) {
  let x, y, z, m, guard = 0;
  do {
    x = (rand() * 2 - 1) * R; y = (rand() * 2 - 1) * R; z = (rand() * 2 - 1) * R;
    m = Math.abs(x) + Math.abs(y) + Math.abs(z);
  } while ((m > R - 1 || m < INNER + 1) && ++guard < 40);
  sites.push({ x, y, z });
}

const cells = [];
for (let iz = 0; iz < G; iz++) for (let iy = 0; iy < G; iy++) for (let ix = 0; ix < G; ix++) {
  const x = (ix / (G - 1) - 0.5) * 2 * R;
  const y = (iy / (G - 1) - 0.5) * 2 * R;
  const z = (iz / (G - 1) - 0.5) * 2 * R;
  const man = Math.abs(x) + Math.abs(y) + Math.abs(z);
  if (man > R || man < INNER) continue;
  let d1 = 1e9, d2 = 1e9, who = 0;
  for (let i = 0; i < sites.length; i++) {
    const dx = x - sites[i].x, dy = y - sites[i].y, dz = z - sites[i].z;
    const d = dx * dx + dy * dy + dz * dz;
    if (d < d1) { d2 = d1; d1 = d; who = i; }
    else if (d < d2) d2 = d;
  }
  if (Math.sqrt(d2) - Math.sqrt(d1) < WALL) cells.push({ x, y, z, who });
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 36, 90);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(38) / 2) / Math.pow(camera.aspect, 0.6))) : 38; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(28, 16, 28);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(20, 28, 12); scene.add(sun);

const mesh = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.72, 0.72, 0.72),
  new THREE.MeshStandardMaterial({ roughness: 0.28, metalness: 0.35 }),
  Math.max(1, cells.length)
);
mesh.setColorAt(0, new THREE.Color());
const m4 = new THREE.Matrix4(), col = new THREE.Color();
cells.forEach((c, i) => {
  m4.makeTranslation(c.x, c.y, c.z);
  mesh.setMatrixAt(i, m4);
  mesh.setColorAt(i, col.copy(cols[c.who % cols.length]));
});
mesh.count = cells.length;
mesh.instanceMatrix.needsUpdate = true;
if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
scene.add(mesh);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.34, 0.26, 0.93));
composer.addPass(new OutputPass());

const info = document.getElementById('info');
info.textContent = `014 · SALT HIVE · ${pal.name} · ${cells.length} cells · seed ${seed}`;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `014_salt-hive_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});
renderer.setAnimationLoop(() => { controls.update(); composer.render(); });
</script>
</body>
</html>
