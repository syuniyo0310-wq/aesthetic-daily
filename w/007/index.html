<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8eaee; font: 12px/1.6 ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  #art { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  body.light #art { width: 50%; height: 50%; transform: scale(2); transform-origin: 0 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 14px; align-items: center; padding: 12px 16px;
         padding-top: max(12px, env(safe-area-inset-top)); background: linear-gradient(#000a, #0000); pointer-events: none; }
  #top > * { pointer-events: auto; }
  #top .t { color: #fff; letter-spacing: .2em; }
  #top .s { opacity: .6; margin-left: auto; }
  #bar { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px;
         max-width: calc(100vw - 20px); overflow-x: auto; padding: 6px; border-radius: 12px; background: #0b0c0fcc; backdrop-filter: blur(8px);
         border: 1px solid #ffffff1a; scrollbar-width: none; }
  #bar button { flex: none; display: flex; gap: 6px; align-items: center; padding: 8px 10px; min-height: 40px; border-radius: 8px;
                border: 1px solid #ffffff22; background: #ffffff0d; white-space: nowrap; }
  #bar button:active, #bar button.flash { background: #7ff0c433; border-color: #7ff0c4; }
  #bar button.on { border-color: #7ff0c4; color: #7ff0c4; }
  #bar .sep { flex: none; width: 1px; background: #ffffff22; margin: 4px 2px; }
  kbd { font: inherit; padding: 0 6px; border: 1px solid #ffffff44; border-bottom-width: 2px; border-radius: 4px; }
  .panel { position: fixed; right: 12px; bottom: 76px; width: min(360px, calc(100vw - 24px)); max-height: 60vh; overflow-y: auto; padding: 16px;
           border-radius: 12px; background: #0b0c0fee; border: 1px solid #ffffff1a; }
  .panel[hidden] { display: none; }
  .panel h3 { font-size: 11px; font-weight: 400; letter-spacing: .2em; opacity: .55; margin: 12px 0 6px; }
  .panel h3:first-child { margin-top: 0; }
  .row { display: flex; gap: 10px; margin-bottom: 6px; }
  .row b { min-width: 76px; font-weight: 400; color: #fff; }
  .panel input { width: 100%; font: inherit; color: inherit; background: #000; border: 1px solid #ffffff33; border-radius: 6px; padding: 8px; }
  .panel .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .panel .btns button, .panel .btns a { padding: 8px 12px; border-radius: 8px; border: 1px solid #ffffff33; background: #ffffff0d; text-decoration: none; }
  @media (min-width: 900px) { #bar { left: auto; right: 14px; transform: none; } }
  @media (max-width: 640px) {
    #bar { flex-wrap: wrap; justify-content: center; width: calc(100vw - 20px); }
    #bar button { min-height: 44px; }
    .panel { bottom: auto; top: 52px; max-height: calc(100vh - 220px); }
  }
  #toast { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: #111c18ee;
           border: 1px solid #7ff0c4; color: #bfffe6; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<iframe id="art" title="Rule Ribbon" allow="fullscreen"></iframe>
<div id="top"><a href="../../">← 作品一覧</a><span class="t">007 · RULE RIBBON</span><span class="s" id="seedLabel"></span></div>
<nav id="bar"></nav>
<div class="panel" id="guide" hidden>
  <h3>この作品のキー（画面下のボタンでも同じ）</h3><div id="keyList"></div>
  <h3>視点</h3><div id="mouseList"></div>
  <h3>seed とは</h3><p style="margin:0;opacity:.75">同じ seed なら同じ絵が再現されます。R で別の seed に。気に入ったら「シェア」でその絵をそのまま共有できます。</p>
</div>
<div class="panel" id="sharePanel" hidden>
  <h3>この seed をシェア</h3>
  <input id="shareUrl" readonly>
  <div class="btns"><button id="copy">リンクをコピー</button><a id="xpost" target="_blank" rel="noopener">X でポスト</a><button id="native" hidden>その他のアプリ</button></div>
</div>
<div id="toast"></div>
<script>
  const W = {"no":"007","title":"Rule Ribbon","dir":"007_2026-09-26_rule-ribbon","seed":7,"motion":"static","keys":[{"key":"r","label":"R","desc":"別の seed で再生成"},{"key":"s","label":"S","desc":"PNG を保存"}],"three":true};
  const MOUSE = [["ドラッグ","視点を回転"],["ホイール","ズーム"],["右ドラッグ","平行移動"]];
  const TOUCH = [['1本指ドラッグ', '視点を回転'], ['2本指', 'ズーム / 平行移動']];
  const art = document.getElementById('art');
  const coarse = matchMedia('(pointer: coarse)').matches;
  const q = new URLSearchParams(location.search);
  let seed = q.get('seed') ?? W.seed ?? Math.floor(Math.random() * 1e9);
  let light = localStorage.getItem('light') === '1';

  const toast = (m, ms = 3500) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms); };
  const load = () => { art.src = `../../${W.dir}/index.html?seed=${seed}`; };
  const shareUrl = () => `${location.origin}${location.pathname}?seed=${seed}`;

  function syncSeed() {
    try { const s = new URLSearchParams(art.contentWindow.location.search).get('seed'); if (s != null) seed = s; } catch {}
    history.replaceState(null, '', `?seed=${seed}`);
    document.getElementById('seedLabel').textContent = `seed ${seed}`;
    const u = shareUrl();
    document.getElementById('shareUrl').value = u;
    document.getElementById('xpost').href = 'https://x.com/intent/post?' + new URLSearchParams({ text: `${W.no} ${W.title}（seed ${seed}）`, url: u });
  }

  function send(key) {
    const k = W.keys.find((x) => x.key === key); if (!k) return false;
    const win = art.contentWindow; win.dispatchEvent(new win.KeyboardEvent('keydown', { key, bubbles: true }));
    const b = document.querySelector(`#bar [data-key="${key === ' ' ? 'space' : key}"]`);
    if (b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 200); }
    if (key === 's') toast('PNG を保存しました');
    return true;
  }

  const btn = (k) => `<button data-key="${k.key === ' ' ? 'space' : k.key}" title="${k.desc}"><kbd>${k.label}</kbd>${k.desc.replace(/（.*$/, '')}</button>`;
  document.getElementById('bar').innerHTML = W.keys.map(btn).join('') + '<span class="sep"></span>' +
    '<button id="bShare">シェア</button><button id="bGuide">? 操作</button><button id="bLight">軽量</button>';
  document.getElementById('keyList').innerHTML = W.keys.map((k) => `<div class="row"><b>${k.label}</b>${k.desc}</div>`).join('');
  document.getElementById('mouseList').innerHTML = (W.three ? (coarse ? TOUCH : MOUSE) : [['—', 'この作品は平面です（キーで操作）']])
    .map(([a, b]) => `<div class="row"><b>${a}</b>${b}</div>`).join('');

  const panels = { bShare: 'sharePanel', bGuide: 'guide' };
  function toggle(id) { for (const [b, p] of Object.entries(panels)) { const el = document.getElementById(p);
    el.hidden = b === id ? !el.hidden : true; document.getElementById(b).classList.toggle('on', !el.hidden); } }

  function setLight(on, msg) {
    light = on; localStorage.setItem('light', on ? '1' : '0');
    document.body.classList.toggle('light', on); document.getElementById('bLight').classList.toggle('on', on);
    load(); if (msg) toast(msg, 5000);
  }

  document.addEventListener('click', async (e) => {
    const k = e.target.closest('[data-key]'); if (k) return send(k.dataset.key === 'space' ? ' ' : k.dataset.key);
    const id = e.target.closest('button')?.id;
    if (id in panels) return toggle(id);
    if (id === 'bLight') return setLight(!light, light ? '通常の画質に戻しました' : '軽量モード（解像度 1/4）にしました');
    if (id === 'copy') { await navigator.clipboard?.writeText(shareUrl()).catch(() => {}); document.getElementById('shareUrl').select(); toast('リンクをコピーしました'); }
    if (id === 'native') navigator.share({ title: `${W.no} ${W.title}`, url: shareUrl() }).catch(() => {});
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (send(e.key.toLowerCase()) && e.key === ' ') e.preventDefault();
  });

  // 重い端末では自動で軽量モードに（1回だけ）
  let frames = 0, t0 = 0, checked = false;
  function watch(t) {
    if (!t0) t0 = t;
    frames++;
    if (t - t0 > 4000) {
      const fps = frames * 1000 / (t - t0); frames = 0; t0 = t;
      if (!checked && !light && fps < 24) { checked = true; return setLight(true, '重いようなので軽量モードにしました（「軽量」で戻せます）'); }
      checked = true;
    }
    if (!checked) requestAnimationFrame(watch);
  }
  art.addEventListener('load', () => { syncSeed(); if (!checked) setTimeout(() => requestAnimationFrame(watch), 1500); });

  document.getElementById('native').hidden = !navigator.share;
  document.body.classList.toggle('light', light); document.getElementById('bLight').classList.toggle('on', light);
  load(); syncSeed();
  if (coarse && !localStorage.getItem('seenTip')) {
    localStorage.setItem('seenTip', '1');
    setTimeout(() => toast('画面下のボタンで作品を操作できます。重い時は「軽量」を', 5000), 800);
  }
</script>
</body>
</html>
