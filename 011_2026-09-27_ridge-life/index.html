<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>011 — Ridge Life</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #info { position: fixed; left: 18px; bottom: 14px; font: 11px/1.6 ui-monospace, Menlo, monospace;
          letter-spacing: .12em; color: rgba(255,255,255,.5); pointer-events: none; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>#info, .info, #hud, .hud { display: none !important; }</style>
<script>addEventListener('dblclick', () => { const u = new URL(location.href); try { const v = window.__view?.get?.(); if (v && [v.x, v.y, v.z].every(Number.isFinite)) u.searchParams.set('cam', [v.x, v.y, v.z, v.tx ?? 0, v.ty ?? 0, v.tz ?? 0].join(',')); } catch {} u.searchParams.set('t', String(Date.now())); location.replace(u.href); });</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const seed = q.has('seed') ? +q.get('seed') : Math.floor(Math.random() * 1e9);
let s = seed >>> 0;
const rand = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const RULES = [
  { name: 'Conway', b: [3], s: [2, 3] },
  { name: 'HighLife', b: [3, 6], s: [2, 3] },
  { name: 'Maze', b: [3], s: [1, 2, 3, 4, 5] },
  { name: 'Coral', b: [3], s: [4, 5, 6, 7, 8] },
];
const CHEMS = [
  { name: 'worms', F: 0.054, k: 0.063 },
  { name: 'maze', F: 0.029, k: 0.057 },
  { name: 'coral', F: 0.0545, k: 0.062 },
  { name: 'links', F: 0.046, k: 0.063 },
];
const PALETTES = [
  { name: 'Neon', bg: '#06040c', c: ['#ff2fb3', '#00e5ff', '#7dff3a', '#ffe14d'] },
  { name: '浮世絵', bg: '#0b1020', c: ['#e63946', '#f1faee', '#e9c46a', '#457b9d'] },
  { name: '墨と金', bg: '#0a0908', c: ['#b08d57', '#f4e9d8', '#8c2f39', '#3a332c'] },
];
const pal = pick(PALETTES);
const stops = pal.c.map((h) => new THREE.Color(h));
const colorAt = (h, out) => {
  const f = (((h % 1) + 1) % 1) * stops.length, i = Math.floor(f);
  return out.lerpColors(stops[i], stops[(i + 1) % stops.length], f - i);
};

const N = 64, TAU = Math.PI * 2, Du = 0.16, Dv = 0.08;
let U = new Float32Array(N * N), V = new Float32Array(N * N);
let alive = new Uint8Array(N * N), hue = new Float32Array(N * N), age = new Uint16Array(N * N);
let rule = pick(RULES), chem = pick(CHEMS);
const at = (a, x, y) => a[((y + N) % N) * N + ((x + N) % N)];

function seedChem() {
  U.fill(1); V.fill(0);
  const n = 5 + Math.floor(rand() * 5);
  for (let i = 0; i < n; i++) {
    const cx = rand() * N, cy = rand() * N, r = 3 + rand() * 5;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      if (Math.hypot(x - cx, y - cy) < r) { const k = y * N + x; U[k] = 0.5; V[k] = 0.25 + rand() * 0.2; }
    }
  }
}
function seedLife() {
  alive.fill(0); age.fill(0);
  for (let k = 0; k < N * N; k++) if (land(k) && rand() < 0.52) {
    alive[k] = 1; hue[k] = rand(); age[k] = 1 + Math.floor(rand() * 6);
  }
}
function grad(k) {
  const x = k % N, y = (k / N) | 0;
  return Math.abs(at(V, x + 1, y) - at(V, x - 1, y)) + Math.abs(at(V, x, y + 1) - at(V, x, y - 1));
}
function land(k) { return grad(k) > 0.028 || V[k] > 0.28; }
function stepGS() {
  const nU = new Float32Array(N * N), nV = new Float32Array(N * N);
  const { F, k } = chem;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, u = U[i], v = V[i], uvv = u * v * v;
    const lu = at(U, x + 1, y) + at(U, x - 1, y) + at(U, x, y + 1) + at(U, x, y - 1) - 4 * u;
    const lv = at(V, x + 1, y) + at(V, x - 1, y) + at(V, x, y + 1) + at(V, x, y - 1) - 4 * v;
    nU[i] = Math.min(1, Math.max(0, u + Du * lu - uvv + F * (1 - u)));
    nV[i] = Math.min(1, Math.max(0, v + Dv * lv + uvv - (F + k) * v));
  }
  U = nU; V = nV;
}
function stepLife() {
  const na = new Uint8Array(N * N), nh = new Float32Array(N * N), ng = new Uint16Array(N * N);
  let pop = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    if (!land(i)) continue;
    let n = 0, sx = 0, sy = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const j = ((y + dy + N) % N) * N + (x + dx + N) % N;
      if (alive[j] && land(j)) { n++; sx += Math.cos(hue[j] * TAU); sy += Math.sin(hue[j] * TAU); }
    }
    if (alive[i]) {
      if (rule.s.includes(n)) { na[i] = 1; nh[i] = hue[i]; ng[i] = Math.min(40, age[i] + 1); pop++; }
    } else if (rule.b.includes(n)) {
      na[i] = 1; nh[i] = Math.atan2(sy, sx) / TAU + (rand() < 0.08 ? (rand() - 0.5) * 0.35 : 0);
      ng[i] = 1; pop++;
    }
  }
  alive = na; hue = nh; age = ng; return pop;
}

let eventText = '', lastEvent = 0, nextEvent = 70, gen = 0;
function fireEvent() {
  if (rand() < 0.5) { rule = pick(RULES.filter((r) => r !== rule)); eventText = 'LIFE → ' + rule.name; }
  else { chem = pick(CHEMS.filter((c) => c !== chem)); seedChem(); eventText = 'CHEM → ' + chem.name; }
  lastEvent = gen; nextEvent = 50 + Math.floor(rand() * 50);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(pal.bg);
scene.fog = new THREE.Fog(pal.bg, 70, 150);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
const fitFov = () => { camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(38) / 2) / Math.pow(camera.aspect, 0.6))) : 38; camera.updateProjectionMatrix(); };
fitFov();
camera.position.set(34, 26, 40);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
window.__view = { get() { const p = camera.position, t = controls.target; return { x:+p.x.toFixed(3), y:+p.y.toFixed(3), z:+p.z.toFixed(3), tx:+(t?.x??0).toFixed(3), ty:+(t?.y??0).toFixed(3), tz:+(t?.z??0).toFixed(3) }; }, set(v) { if (!v) return; camera.position.set(v.x, v.y, v.z); controls.target.set(v.tx ?? 0, v.ty ?? 0, v.tz ?? 0); controls.update(); } };
{ const c = q.get('cam'); if (c) { const [x, y, z, tx, ty, tz] = c.split(',').map(Number); if ([x, y, z].every(Number.isFinite)) window.__view.set({ x, y, z, tx, ty, tz }); } }
const __tell = () => { try { parent.postMessage({ type: 'aa-view', view: window.__view.get() }, '*'); } catch {} };
controls.addEventListener('change', __tell); setInterval(__tell, 400); __tell();
scene.add(new THREE.HemisphereLight(0xffffff, pal.bg, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(30, 50, 20); scene.add(sun);

const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.48, metalness: 0.12 }), N * N);
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
mesh.setColorAt(0, new THREE.Color());
scene.add(mesh);
const m4 = new THREE.Matrix4(), col = new THREE.Color(), sc = new THREE.Vector3();

function sync() {
  let c = 0;
  for (let k = 0; k < N * N; k++) {
    const g = grad(k);
    if (g < 0.026 && !alive[k]) continue;
    const h = 0.7 + g * 28 + (alive[k] ? Math.min(14, age[k]) * 0.2 : 0);
    m4.makeTranslation((k % N) - N / 2, h * 0.5, ((k / N) | 0) - N / 2);
    m4.scale(sc.set(0.86, h, 0.86));
    mesh.setMatrixAt(c, m4);
    if (alive[k]) colorAt(hue[k], col);
    else colorAt(0.15 + g * 2, col).multiplyScalar(0.55);
    mesh.setColorAt(c, col);
    c++;
  }
  mesh.count = c;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return c;
}

seedChem();
for (let i = 0; i < 160; i++) stepGS();
seedLife();
let pop = sync();

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.38, 0.32, 0.92));
composer.addPass(new OutputPass());

const info = document.getElementById('info');
let paused = false;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; fitFov(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
addEventListener('keydown', (e) => {
  if (e.key === 'r') location.search = `?seed=${Math.floor(Math.random() * 1e9)}`;
  if (e.key === 'e') fireEvent();
  if (e.key === ' ') paused = !paused;
  if (e.key === 's') { const a = document.createElement('a'); a.download = `011_ridge-life_${seed}.png`; a.href = renderer.domElement.toDataURL(); a.click(); }
});

const STEP_MS = 90;
let acc = 0, last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(100, now - last); last = now;
  if (!paused) acc += dt;
  while (acc >= STEP_MS) {
    acc -= STEP_MS;
    stepGS(); pop = stepLife(); gen++;
    if (pop < 40) seedLife();
    else if (pop > N * N * 0.42) fireEvent();
    else if (gen - lastEvent > nextEvent) fireEvent();
    sync();
  }
  controls.update();
  composer.render();
  const flash = gen - lastEvent < 28 ? `\n${eventText}` : '';
  info.textContent = `011 · RIDGE LIFE · ${rule.name} · ${chem.name} · ${pal.name} · seed ${seed}${flash}`;
});
</script>
</body>
</html>
